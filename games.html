<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DILL DOH | ALL GAMES</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1b18;
            --text-white: #f1f1f1;
            --text-grey: #8a8580;
            --paper-brown: #3d342b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            min-height: 100vh;
            font-family: 'Permanent Marker', cursive, sans-serif;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .metal-title {
            font-family: 'Metal Mania', cursive;
            font-size: 4rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #a3a3a3 50%, #3a3a3a 51%, #757575 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(4px 4px 0px #000);
        }

        /* --- BACK BUTTON --- */
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-grey);
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--text-white);
        }

        /* --- GAMES GRID --- */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }

        /* Game Card Styling */
        .game-card {
            background-color: var(--card-bg);
            border: 2px solid var(--paper-brown);
            padding: 15px;
            text-decoration: none;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 4px;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            clip-path: polygon(
                0% 2%, 98% 0%, 100% 98%, 2% 100%
            );
        }

        .game-card:hover {
            transform: scale(1.05) rotate(-1deg);
            border-color: var(--text-white);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.8);
        }

        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 2px;
            background-color: #0d0d0d;
        }

        .game-title {
            margin-top: 15px;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&larr; Back to Home</a>

    <header>
        <h1 class="metal-title">GAME LIBRARY</h1>
    </header>

    <main class="games-grid">

        <!-- GAME 1: FNAF -->
        <a href="games/fnaf.html" class="game-card">
            <!-- Replace image src with your custom thumbnail path if you have one -->
            <img src="https://images.immediate.co.uk/production/volatile/sites/3/2023/08/FNAF-games-in-order-cd67434.jpg?quality=90" alt="FNAF Game Thumbnail">
            <div class="game-title">FNAF 1</div>
        </a>

        <!-- GAME 2: TEST -->
        <a href="games/bartbash.html" class="game-card">
            <!-- Replace image src with your custom thumbnail path if you have one -->
            <img src="https://via.placeholder.com/300x200/1e1b18/f1f1f1?text=TEST" alt="Test Game Thumbnail">
            <div class="game-title">Test Ga1me</div>
        </a>


        <a href="games/AnimalCrossing.html" class="game-card">
            <!-- Replace image src with your custom thumbnail path if you have one -->
            <img src="https://i.ebayimg.com/00/s/OTk3WDEzMTI=/z/AkwAAOSw6NNfZcRl/$_57.PNG?set_id=8800005007" alt=" Thumbnail">
            <div class="game-title">Animal Crossing</div>
        </a>
        
    </main>

</body>
</html>
