<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL GAMES</title>
    <meta name="description" content="Browse the DillDoe game library, find a game, read playing tips, and open it in your browser.">
    <meta name="google-adsense-account" content="ca-pub-6483528780801608">
    <link rel="canonical" href="https://dilldoe-games.pages.dev/games">
    <link rel="stylesheet" href="/assets/site-ads.css">
    <script src="/assets/site-ads.js" defer></script>

    <style>
        .library-display-ad { width: 234px; height: 60px; margin: 0 auto; }
        @media (min-width: 400px) { .library-display-ad { width: 320px; height: 100px; } }
        @media (min-width: 600px) { .library-display-ad { width: 468px; height: 60px; } }
        @media (min-width: 900px) { .library-display-ad { width: 728px; height: 90px; } }
        /* Frutiger Aero theme */

        :root {
            --aqua-light: #d6f5ff;
            --aqua-bright: #00d2ff;
            --aqua-deep: #0072ff;
            --aqua-dark: #003366;
            --gel-green: #3cd070;
            --glass-white: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-shadow: rgba(0, 100, 200, 0.35);

            /* Classic early 2000s font stacks */
            --font-heading: 'Trebuchet MS', 'Lucida Grande', 'Segoe UI', Tahoma, sans-serif;
            --font-body: 'Lucida Grande', Tahoma, 'Segoe UI', Verdana, sans-serif;
        }

        /* CUSTOM AQUA CLEAR BLUE MOUSE CURSOR (SVG Base64 inspired by early 2000s liquid mouse) */
        body, a, button, input {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><defs><linearGradient id="aqua" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#dff8ff"/><stop offset="70%" stop-color="#59d0ff"/><stop offset="100%" stop-color="#0a78d6"/></linearGradient></defs><path d="M4 3 L4 23 L13 18 L18 30 L22 27 L17 15 L28 12 Z" fill="url(#aqua)" stroke="#003366" stroke-width="1.5"/><circle cx="22" cy="10" r="2.5" fill="rgba(255,255,255,0.9)"/></svg>') 0 0, auto;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, rgba(0, 110, 200, 0.25) 0%, rgba(0, 190, 255, 0.15) 100%),
                        url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWn06EKF4l8vPj4NNF6Da7XtkAnR3tWl_K3fZQLjvSwSJVmlqV6jLgFHX6&s=10") center/cover no-repeat fixed;
            color: var(--aqua-dark);
            min-height: 100vh;
            font-family: var(--font-body);
            padding: 25px 20px 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        #bubbleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .bg-meme-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .nyan-cat {
            position: absolute;
            top: 10%;
            width: 180px;
            height: auto;
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.9));
            animation: flyNyan 11s linear infinite;
        }

        @keyframes flyNyan {
            0% { left: -220px; transform: translateY(0px) scale(0.95); }
            50% { transform: translateY(25px) scale(1.05); }
            100% { left: 100vw; transform: translateY(0px) scale(0.95); }
        }

        .doge-meme {
            position: absolute;
            bottom: 4%;
            left: 2%;
            width: 135px;
            opacity: 0.88;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
            animation: floatDoge 5s ease-in-out infinite alternate;
        }

        @keyframes floatDoge {
            0% { transform: translateY(0) rotate(-6deg); }
            100% { transform: translateY(-22px) rotate(6deg); }
        }

        .troll-face {
            position: absolute;
            top: 18%;
            right: 3%;
            width: 125px;
            opacity: 0.8;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.85));
            animation: floatTroll 4.5s ease-in-out infinite alternate;
        }

        @keyframes floatTroll {
            0% { transform: translateY(0) scale(0.98); }
            100% { transform: translateY(22px) scale(1.08); }
        }

        .sad-bart {
            position: absolute;
            bottom: 5%;
            right: 3%;
            width: 115px;
            opacity: 0.8;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.85));
            animation: floatBart 6s ease-in-out infinite alternate;
        }

        @keyframes floatBart {
            0% { transform: translateY(0) rotate(4deg); }
            100% { transform: translateY(-18px) rotate(-4deg); }
        }

        header, main, .search-container, .top-nav {
            position: relative;
            z-index: 3;
        }

        .top-nav {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            font-family: var(--font-heading);
            color: #003055;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 24px;
            background: linear-gradient(180deg, #ffffff 0%, #d4f2ff 45%, #7bd7ff 50%, #20b0ff 85%, #0088e0 100%);
            border-radius: 20px;
            border: 1.5px solid #ffffff;
            box-shadow: 0 4px 12px rgba(0, 70, 150, 0.35), inset 0 1px 1px #ffffff, inset 0 -2px 3px rgba(0, 50, 120, 0.4);
            transition: all 0.2s ease;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .back-btn:hover {
            background: linear-gradient(180deg, #ffffff 0%, #e8f8ff 45%, #9ee3ff 50%, #4cc3ff 85%, #00a0f0 100%);
            box-shadow: 0 6px 18px rgba(0, 170, 255, 0.6), inset 0 1px 2px #ffffff;
            transform: translateY(-2px);
        }

        header {
            text-align: center;
            margin-bottom: 22px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 18px 45px;
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0, 90, 180, 0.25), inset 0 2px 4px rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 40px 40px 0 0;
            pointer-events: none;
        }

        .aero-title {
            font-family: var(--font-heading);
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #e0f4ff 35%, #1ac0ff 65%, #0055b8 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 6px rgba(0, 40, 100, 0.4)) drop-shadow(0 1px 0 #ffffff);
        }

        .search-container {
            width: 100%;
            max-width: 520px;
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
        }

        .search-bar {
            width: 100%;
            padding: 14px 28px;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(230, 245, 255, 0.6) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            color: #003366;
            border-radius: 30px;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 5px rgba(0, 60, 130, 0.25), 0 8px 20px rgba(0, 100, 200, 0.2);
            text-align: center;
        }

        .search-bar::placeholder {
            color: rgba(0, 60, 120, 0.65);
            font-weight: 600;
        }

        .search-bar:focus {
            background: linear-gradient(180deg, #ffffff 0%, #e6f7ff 100%);
            border-color: #00d2ff;
            box-shadow: inset 0 2px 4px rgba(0, 60, 130, 0.15), 0 0 25px rgba(0, 210, 255, 0.8);
            transform: scale(1.02);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 28px;
            width: 100%;
            max-width: 1100px;
        }

        .game-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(210, 240, 255, 0.25) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 14px;
            text-decoration: none;
            color: #003366;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 22px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 70, 150, 0.25), inset 0 2px 2px rgba(255, 255, 255, 0.95);
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 48%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 20px 20px 0 0;
            pointer-events: none;
            z-index: 2;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.03);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(180, 230, 255, 0.45) 100%);
            border-color: #ffffff;
            box-shadow: 0 18px 38px rgba(0, 140, 255, 0.4), 0 0 22px rgba(0, 210, 255, 0.6), inset 0 2px 4px #ffffff;
        }

        .img-wrapper {
            width: 100%;
            height: 160px;
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.3), 0 3px 8px rgba(0, 50, 100, 0.2);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #cbeaff;
            transition: transform 0.4s ease;
        }

        .game-card:hover img {
            transform: scale(1.08);
        }

        .img-wrapper::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 200%;
            height: 200%;
            background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            transition: all 0.6s ease;
            pointer-events: none;
        }

        .game-card:hover .img-wrapper::after {
            top: 50%;
            left: 50%;
        }

        .game-title {
            margin-top: 14px;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 1.05rem;
            text-align: center;
            line-height: 1.3;
            color: #002b55;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
            transition: color 0.2s ease;
        }

        .game-card:hover .game-title {
            color: #0066d6;
        }
        .library-count {
            position: relative; z-index: 3;
            display: flex; align-items: center; justify-content: center;
            flex-wrap: wrap; gap: 9px; margin: -18px 0 25px;
            padding: 11px 26px; border-radius: 30px;
            color: #003b70; font-family: var(--font-heading);
            font-size: 1.05rem; font-weight: 700;
            background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(156,222,255,.65) 50%, rgba(48,167,239,.65));
            border: 2px solid rgba(255,255,255,.95);
            box-shadow: 0 7px 20px rgba(0,75,150,.25), inset 0 2px 3px #fff;
            text-shadow: 0 1px 0 rgba(255,255,255,.8);
        }
        .library-count strong { font-size: 1.25em; }
        .count-orb { color: #008ed6; }
        .count-search { font-size: .88rem; font-weight: 600; opacity: .85; }
        .count-search[hidden], .no-results[hidden] { display: none; }
        .no-results { position: relative; z-index: 3; padding: 25px; font-weight: 700; text-align: center; }
        .site-ad, .library-privacy { position: relative; z-index: 3; }
        .site-ad { max-width: 100%; margin-bottom: 28px; text-align: center; }
        .library-privacy { margin-top: 35px; }
        .library-privacy a { color: #003366; }
        @media (max-width: 600px) {
            body { padding: 18px 12px 45px; }
            header { padding: 16px 24px; max-width: 100%; }
            .aero-title { font-size: clamp(1.7rem, 8vw, 3.2rem); }
            .games-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
            .game-card { padding: 9px; }
            .img-wrapper { height: 125px; }
            .game-title { font-size: .9rem; }
            .search-container { margin-bottom: 32px; }
            .library-display-ad { max-width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .nyan-cat, .doge-meme, .troll-face, .sad-bart { animation: none; }
            .game-card, .game-card img { transition: none; }
        }
    </style>
</head>

<body>
    <canvas id="bubbleCanvas"></canvas>

    <div class="bg-meme-container">
        <img class="nyan-cat" src="https://freepngimg.com/save/15407-nyan-cat-picture/512x512" alt="Nyan Cat">
        <img class="doge-meme" src="https://pngimg.com/uploads/doge_meme/doge_meme_PNG112723.png" alt="Doge">
        <img class="troll-face" src="https://www.pngkey.com/png/full/22-226917_memes-unhappy-troll-sticker-sad-trollface.png" alt="Sad Trollface">
        <img class="sad-bart" src="https://www.nicepng.com/png/full/136-1362322_sad-simpsons-and-bart-image-bart-simpson-sad.png" alt="Sad Bart Simpson">
    </div>

    <div class="top-nav">
        <a href="/" class="back-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Home
        </a>
    </div>

    <header>
        <h1 class="aero-title">GAME LIBRARY</h1>
    </header>

    <div class="search-container">
        <input
            type="text"
            id="searchInput"
            class="search-bar"
            placeholder="🔍 Search game collection..."
            autocomplete="off" aria-label="Search games"
        >
    </div>

    <div class="library-count" id="libraryCount" role="status" aria-live="polite">
        <span class="count-orb" aria-hidden="true">✦</span>
        <span><strong id="gameCount">0</strong> Games Available</span>
        <span class="count-search" id="searchCount" hidden></span>
    </div>

    <aside class="site-ad site-ad-banner" aria-label="Advertisement">
        <span class="site-ad-label">Advertisements</span>
        <ins class="adsbygoogle library-display-ad" data-site-ad data-ad-client="ca-pub-6483528780801608" data-ad-slot="3349064473" style="display:block"></ins>
    </aside>

    <main class="games-grid" id="gamesGrid">
        <a href="games/Submit.html" class="game-card" data-not-game="true">
            <div class="img-wrapper">
                <img loading="eager" decoding="async" src="https://upload.wikimedia.org/wikipedia/commons/c/cb/Frutiger_Aero_%282%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Game Request">
            </div>
            <div class="game-title">Request ANY game</div>
        </a>

        <a href="games/Ktane.html" class="game-card">
            <div class="img-wrapper">
                <img loading="lazy" decoding="async" src="https://keeptalkinggame.com/wp-content/uploads/2019/12/4_bomb_600x338.jpg" alt="Ktane">
            </div>
            <div class="game-title">Keep Talking and Nobody Explodes</div>
        </a>

    </main>

    <p id="noResults" class="no-results" hidden>No games found. Try another search.</p>
    <footer class="library-privacy"><a href="/privacy.html">Privacy &amp; advertising</a></footer>

    <script>
        const gamesGrid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const gameCount = document.getElementById('gameCount');
        const searchCount = document.getElementById('searchCount');
        const noResults = document.getElementById('noResults');

        function filterGames() {
            const query = searchInput.value.trim().toLocaleLowerCase();
            const cards = gamesGrid.querySelectorAll('.game-card');
            let total = 0;
            let matching = 0;
            cards.forEach(card => {
                const isGame = card.dataset.notGame !== 'true';
                if (isGame) total++;
                const title = (card.querySelector('.game-title')?.textContent || '').toLocaleLowerCase();
                const visible = title.includes(query);
                card.style.display = visible ? 'flex' : 'none';
                if (visible && isGame) matching++;
            });
            gameCount.textContent = total.toLocaleString();
            searchCount.hidden = !query;
            searchCount.textContent = query ? `• ${matching} matching` : '';
            noResults.hidden = !query || [...cards].some(card => card.style.display !== 'none');
        }
        searchInput.addEventListener('input', filterGames);
        new MutationObserver(filterGames).observe(gamesGrid, { childList: true, subtree: false });
        filterGames();
    </script>
</body>
</html>
