<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adrians Clicker</title>

  <style>
    :root {
      --bg1: #392015;
      --bg2: #170d0a;
      --panel: rgba(42, 22, 14, 0.82);
      --gold: #ffd36b;
      --cream: #fff0c5;
      --brown: #6c321d;
      --green: #6bdf7c;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(circle at top, #744125 0%, transparent 42%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .game {
      width: min(1100px, 94vw);
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: clamp(2.3rem, 5vw, 4rem);
      text-shadow: 0 4px 0 #6d321b, 0 7px 20px rgba(0, 0, 0, 0.5);
    }

    .subtitle {
      margin: 8px 0 0;
      color: #f8db9d;
      opacity: 0.9;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 1.05fr) minmax(310px, 0.95fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      background: var(--panel);
      border: 2px solid rgba(255, 211, 107, 0.25);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }

    .cookie-area {
      min-height: 625px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 28px;
    }

    .stats {
      text-align: center;
      z-index: 2;
      margin-bottom: 14px;
    }

    #adriansCount {
      margin: 0;
      font-size: clamp(2.1rem, 5vw, 3.4rem);
      color: var(--gold);
      text-shadow: 0 3px 0 #71351e;
    }

    #perSecond {
      margin: 8px 0 0;
      color: #f5dba4;
      font-size: 1rem;
    }

    #cookieButton {
      width: min(330px, 72vw);
      aspect-ratio: 1;
      margin: 24px 0 18px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 16px 12px rgba(0, 0, 0, 0.38));
      touch-action: manipulation;
    }

    #cookieButton:hover {
      transform: scale(1.04);
    }

    #cookieButton:active {
      transform: scale(0.92);
    }

    #cookieImage {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      object-fit: cover;
      border: 8px solid #e9a052;
      background: #d7873d;
    }

    .click-hint {
      margin: 0;
      color: #f9dfaa;
      font-weight: bold;
      letter-spacing: 0.4px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      z-index: 2;
    }

    .small-button {
      border: 1px solid rgba(255, 211, 107, 0.35);
      border-radius: 10px;
      padding: 10px 13px;
      background: rgba(255, 218, 153, 0.12);
      color: var(--cream);
      font-weight: bold;
      cursor: pointer;
    }

    .small-button:hover {
      background: rgba(255, 218, 153, 0.22);
    }

    .shop {
      padding: 22px;
    }

    .shop h2 {
      margin: 0 0 7px;
      color: var(--gold);
      font-size: 1.8rem;
    }

    .shop-description {
      margin: 0 0 18px;
      color: #eed7ad;
      font-size: 0.95rem;
    }

    .upgrade {
      width: 100%;
      display: grid;
      grid-template-columns: 58px 1fr auto;
      align-items: center;
      gap: 13px;
      padding: 13px;
      margin-bottom: 12px;
      border: 2px solid rgba(255, 211, 107, 0.18);
      border-radius: 15px;
      background: rgba(97, 48, 29, 0.62);
      color: var(--cream);
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .upgrade:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(130, 66, 37, 0.78);
      border-color: rgba(255, 211, 107, 0.46);
    }

    .upgrade:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .upgrade-icon {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 13px;
      background: #f4bf68;
      font-size: 1.9rem;
    }

    .upgrade-name {
      display: block;
      color: #ffe2a0;
      font-size: 1.04rem;
      font-weight: bold;
    }

    .upgrade-info {
      display: block;
      margin-top: 5px;
      color: #efd8ae;
      font-size: 0.84rem;
    }

    .upgrade-price {
      color: var(--gold);
      font-size: 0.9rem;
      font-weight: bold;
      white-space: nowrap;
      text-align: right;
    }

    .floating-number {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      color: var(--gold);
      font-size: 1.55rem;
      font-weight: 900;
      text-shadow: 0 3px 2px rgba(75, 27, 10, 0.9);
      animation: floatUp 0.85s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(0.7);
      }

      18% {
        opacity: 1;
        transform: translate(-50%, -15px) scale(1.1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -105px) scale(1);
      }
    }

    .sparkle {
      position: absolute;
      border-radius: 50%;
      width: 10px;
      height: 10px;
      background: #ffe89b;
      box-shadow: 0 0 16px 5px rgba(255, 210, 84, 0.6);
      opacity: 0.65;
      animation: sparkle 2.2s infinite ease-in-out;
    }

    .sparkle:nth-child(1) {
      top: 13%;
      left: 15%;
      animation-delay: 0s;
    }

    .sparkle:nth-child(2) {
      top: 25%;
      right: 13%;
      animation-delay: 0.65s;
    }

    .sparkle:nth-child(3) {
      bottom: 18%;
      left: 18%;
      animation-delay: 1.2s;
    }

    .sparkle:nth-child(4) {
      bottom: 26%;
      right: 14%;
      animation-delay: 1.75s;
    }

    @keyframes sparkle {
      0%, 100% {
        transform: scale(0.4);
        opacity: 0.2;
      }

      50% {
        transform: scale(1.25);
        opacity: 0.9;
      }
    }

    @media (max-width: 780px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .cookie-area {
        min-height: 500px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header>
      <h1>Adrians Clicker</h1>
      <p class="subtitle">Click the Adrian cookie. Build an unstoppable Adrian empire.</p>
    </header>

    <section class="layout">
      <div class="cookie-area card">
        <span class="sparkle"></span>
        <span class="sparkle"></span>
        <span class="sparkle"></span>
        <span class="sparkle"></span>

        <div class="stats">
          <h2 id="adriansCount">0 Adrians</h2>
          <p id="perSecond">0 Adrians per second</p>
        </div>

        <button id="cookieButton" aria-label="Click for Adrians">
          <img
            id="cookieImage"
            src="https://cdn.phototourl.com/free/2026-09-14-3e502ad6-a3c4-4f5b-891e-b9b1a61f27c4.jpg"
            alt="Adrian cookie"
          />
        </button>

        <p class="click-hint">Click for +<span id="clickPower">1</span> Adrian<span id="clickPlural"></span></p>

        <div class="controls">
          <button class="small-button" id="saveButton">Save Game</button>
          <button class="small-button" id="resetButton">Reset</button>
        </div>
      </div>

      <aside class="shop card">
        <h2>Adrian Shop</h2>
        <p class="shop-description">Buy upgrades to make more Adrians automatically.</p>

        <button class="upgrade" id="cursorUpgrade">
          <span class="upgrade-icon">🖱️</span>
          <span>
            <span class="upgrade-name">Adrian Cursor</span>
            <span class="upgrade-info">Adds 1 Adrian per second</span>
          </span>
          <span class="upgrade-price" id="cursorPrice">15 Adrians</span>
        </button>

        <button class="upgrade" id="grandmaUpgrade">
          <span class="upgrade-icon">👵</span>
          <span>
            <span class="upgrade-name">Adrian Grandma</span>
            <span class="upgrade-info">Adds 5 Adrians per second</span>
          </span>
          <span class="upgrade-price" id="grandmaPrice">100 Adrians</span>
        </button>

        <button class="upgrade" id="factoryUpgrade">
          <span class="upgrade-icon">🏭</span>
          <span>
            <span class="upgrade-name">Adrian Factory</span>
            <span class="upgrade-info">Adds 25 Adrians per second</span>
          </span>
          <span class="upgrade-price" id="factoryPrice">500 Adrians</span>
        </button>

        <button class="upgrade" id="clickUpgrade">
          <span class="upgrade-icon">⚡</span>
          <span>
            <span class="upgrade-name">Power Click</span>
            <span class="upgrade-info">Adds 1 Adrian to every click</span>
          </span>
          <span class="upgrade-price" id="clickPrice">75 Adrians</span>
        </button>
      </aside>
    </section>
  </main>

  <script>
    const COOKIE_IMAGE =
      "https://cdn.phototourl.com/free/2026-09-14-3e502ad6-a3c4-4f5b-891e-b9b1a61f27c4.jpg";

    const game = {
      adrians: 0,
      cursors: 0,
      grandmas: 0,
      factories: 0,
      clickLevel: 0,
      cursorCost: 15,
      grandmaCost: 100,
      factoryCost: 500,
      clickCost: 75
    };

    const elements = {
      count: document.getElementById("adriansCount"),
      perSecond: document.getElementById("perSecond"),
      cookie: document.getElementById("cookieButton"),
      cookieImage: document.getElementById("cookieImage"),
      clickPower: document.getElementById("clickPower"),
      clickPlural: document.getElementById("clickPlural"),
      cursorButton: document.getElementById("cursorUpgrade"),
      grandmaButton: document.getElementById("grandmaUpgrade"),
      factoryButton: document.getElementById("factoryUpgrade"),
      clickButton: document.getElementById("clickUpgrade"),
      cursorPrice: document.getElementById("cursorPrice"),
      grandmaPrice: document.getElementById("grandmaPrice"),
      factoryPrice: document.getElementById("factoryPrice"),
      clickPrice: document.getElementById("clickPrice"),
      saveButton: document.getElementById("saveButton"),
      resetButton: document.getElementById("resetButton")
    };

    elements.cookieImage.src = COOKIE_IMAGE;

    function formatNumber(number) {
      if (number < 1000) {
        return Math.floor(number).toLocaleString();
      }

      const suffixes = ["K", "M", "B", "T", "Qa", "Qi"];
      const tier = Math.floor(Math.log10(number) / 3);
      const suffix = suffixes[tier - 1] || "∞";
      const scaled = number / Math.pow(1000, tier);

      return `${scaled.toFixed(scaled >= 100 ? 0 : 1)}${suffix}`;
    }

    function getClickPower() {
      return 1 + game.clickLevel;
    }

    function getPerSecond() {
      return game.cursors + game.grandmas * 5 + game.factories * 25;
    }

    function showFloatingNumber(x, y, amount) {
      const floatingNumber = document.createElement("div");
      floatingNumber.className = "floating-number";
      floatingNumber.textContent = `+${formatNumber(amount)}`;
      floatingNumber.style.left = `${x}px`;
      floatingNumber.style.top = `${y}px`;

      document.body.appendChild(floatingNumber);

      setTimeout(() => {
        floatingNumber.remove();
      }, 850);
    }

    function updateUI() {
      const total = Math.floor(game.adrians);
      const perSecond = getPerSecond();
      const clickPower = getClickPower();

      elements.count.textContent = `${formatNumber(total)} Adrian${total === 1 ? "" : "s"}`;
      elements.perSecond.textContent =
        `${formatNumber(perSecond)} Adrian${perSecond === 1 ? "" : "s"} per second`;

      elements.clickPower.textContent = clickPower;
      elements.clickPlural.textContent = clickPower === 1 ? "" : "s";

      elements.cursorPrice.textContent = `${formatNumber(game.cursorCost)} Adrians`;
      elements.grandmaPrice.textContent = `${formatNumber(game.grandmaCost)} Adrians`;
      elements.factoryPrice.textContent = `${formatNumber(game.factoryCost)} Adrians`;
      elements.clickPrice.textContent = `${formatNumber(game.clickCost)} Adrians`;

      elements.cursorButton.disabled = game.adrians < game.cursorCost;
      elements.grandmaButton.disabled = game.adrians < game.grandmaCost;
      elements.factoryButton.disabled = game.adrians < game.factoryCost;
      elements.clickButton.disabled = game.adrians < game.clickCost;
    }

    function saveGame() {
      localStorage.setItem("adriansClickerSave", JSON.stringify(game));
    }

    function loadGame() {
      const savedGame = localStorage.getItem("adriansClickerSave");

      if (!savedGame) return;

      try {
        const loaded = JSON.parse(savedGame);
        Object.assign(game, loaded);
      } catch (error) {
        console.warn("Could not load saved Adrian game.");
      }
    }

    function buyUpgrade(type) {
      if (type === "cursor" && game.adrians >= game.cursorCost) {
        game.adrians -= game.cursorCost;
        game.cursors += 1;
        game.cursorCost = Math.ceil(game.cursorCost * 1.18);
      }

      if (type === "grandma" && game.adrians >= game.grandmaCost) {
        game.adrians -= game.grandmaCost;
        game.grandmas += 1;
        game.grandmaCost = Math.ceil(game.grandmaCost * 1.2);
      }

      if (type === "factory" && game.adrians >= game.factoryCost) {
        game.adrians -= game.factoryCost;
        game.factories += 1;
        game.factoryCost = Math.ceil(game.factoryCost * 1.23);
      }

      if (type === "click" && game.adrians >= game.clickCost) {
        game.adrians -= game.clickCost;
        game.clickLevel += 1;
        game.clickCost = Math.ceil(game.clickCost * 1.55);
      }

      saveGame();
      updateUI();
    }

    elements.cookie.addEventListener("click", (event) => {
      const gained = getClickPower();
      game.adrians += gained;

      const rect = elements.cookie.getBoundingClientRect();
      const x = event.clientX || rect.left + rect.width / 2;
      const y = event.clientY || rect.top + rect.height / 2;

      showFloatingNumber(x, y, gained);
      updateUI();
    });

    elements.cursorButton.addEventListener("click", () => buyUpgrade("cursor"));
    elements.grandmaButton.addEventListener("click", () => buyUpgrade("grandma"));
    elements.factoryButton.addEventListener("click", () => buyUpgrade("factory"));
    elements.clickButton.addEventListener("click", () => buyUpgrade("click"));

    elements.saveButton.addEventListener("click", () => {
      saveGame();
      elements.saveButton.textContent = "Saved!";
      setTimeout(() => {
        elements.saveButton.textContent = "Save Game";
      }, 1000);
    });

    elements.resetButton.addEventListener("click", () => {
      const confirmed = confirm("Reset all Adrians and upgrades?");

      if (!confirmed) return;

      localStorage.removeItem("adriansClickerSave");

      game.adrians = 0;
      game.cursors = 0;
      game.grandmas = 0;
      game.factories = 0;
      game.clickLevel = 0;
      game.cursorCost = 15;
      game.grandmaCost = 100;
      game.factoryCost = 500;
      game.clickCost = 75;

      updateUI();
    });

    loadGame();
    updateUI();

    setInterval(() => {
      game.adrians += getPerSecond() / 10;
      updateUI();
    }, 100);

    setInterval(saveGame, 5000);
  </script>
</body>
</html>
