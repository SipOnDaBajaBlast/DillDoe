<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Just Volleyball · DillDoe</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(160deg,#09112c,#103d69 65%,#0b203d)}
    header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 1rem;background:#07142bbb}a{color:#ffdc45}main{max-width:1200px;margin:2rem auto;padding:0 1rem;text-align:center}
    h1{font-size:clamp(2.3rem,7vw,4.5rem);margin:.5rem 0;color:#ffdc45}p{line-height:1.5}button{cursor:pointer;border:0;border-radius:8px;background:#ffdc45;color:#122247;padding:.8rem 1.4rem;font-size:1rem;font-weight:bold}
    #stage{display:none;position:relative;width:100%;aspect-ratio:16/9;margin:1.5rem auto;background:#000}#stage iframe{width:100%;height:100%;border:0}#stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;margin:0}
    #fullscreen[hidden]{display:none}#status{color:#dceafb}
  </style>
</head>
<body>
  <header><a href="/games">← Game Library</a><strong>Just Volleyball</strong><button id="fullscreen" type="button" hidden>Fullscreen</button></header>
  <main>
    <section id="intro"><h1>Just Volleyball</h1><p>Play the original Godot browser build on a desktop browser. First launch downloads about 150 MB; later visits can use your browser cache.</p><button id="play" type="button">Play game</button></section>
    <div id="stage" aria-label="Just Volleyball game"></div><p id="status" role="status"></p>
  </main>
  <script>
    const stage=document.getElementById('stage'),status=document.getElementById('status');
    document.getElementById('fullscreen').onclick=()=>stage.requestFullscreen();
    document.getElementById('play').onclick=()=>{
      const frame=document.createElement('iframe');frame.src='/ports/jv-source/';frame.title='Just Volleyball';frame.allow='fullscreen; autoplay; gamepad';frame.allowFullscreen=true;
      frame.onload=()=>{status.textContent='Game files are loading. This may take a few minutes on the first visit.'};
      frame.onerror=()=>{status.textContent='The game could not load. Reload this page and try again.'};
      stage.append(frame);stage.style.display='block';document.getElementById('intro').hidden=true;document.getElementById('fullscreen').hidden=false;status.textContent='Opening the game…';frame.focus();
    };
  </script>
</body>
</html>
