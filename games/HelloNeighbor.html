<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <title>Hello Neighbor · DillDoe</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #stage { position: fixed; inset: 0; background: #000; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    #options { position: fixed; z-index: 5; top: 10px; right: 10px; display: flex; gap: 8px; align-items: center; }
    #options a, #options button, #options select { border: 1px solid #ffffff66; border-radius: 8px; padding: 8px 12px; color: white; background: #101722dd; font: 14px system-ui,sans-serif; text-decoration: none; cursor: pointer; }
    #options label { color: #d5dbe6; font: 13px system-ui,sans-serif; }
    #note { position: fixed; z-index: 4; left: 12px; bottom: 40px; max-width: 34em; margin: 0; padding: 8px 12px; border-radius: 8px; background: #101722cc; color: #d5dbe6; font: 13px/1.4 system-ui,sans-serif; }
  </style>
</head>
<body>
  <main id="stage" aria-label="Hello Neighbor game"><iframe id="game" title="Hello Neighbor" allow="cross-origin-isolated; fullscreen; autoplay; gamepad" allowfullscreen></iframe></main>
  <p id="note" role="status">First load downloads about 160 MB, then the game starts from your browser's cache. If it runs slowly, set Quality to Low. The FPS counter is in the top-left corner (Ctrl+Shift+F hides it).</p>
  <nav id="options" aria-label="Game options">
    <label for="quality">Quality</label>
    <select id="quality">
      <option value="">Auto</option>
      <option value="low">Low (fastest)</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <a href="/games">Game library</a><a id="separate" href="#" target="_blank" rel="noopener">Open separately</a><button id="fullscreen" type="button">Fullscreen</button>
  </nav>
  <script>
    // The port picks low/medium/high itself from the device (Auto). ?quality= overrides that, and the
    // engine reads it once at start, so changing it reloads the game. fps=1 shows its frame counter.
    const GAME = 'https://dilldoe-gamefiles.pages.dev/ports/hello-neighbor/';
    const frame = document.getElementById('game'), select = document.getElementById('quality'), separate = document.getElementById('separate');
    let saved = '';
    try { saved = localStorage.getItem('dilldoe-hn-quality') || ''; } catch {}
    if ([...select.options].some(o => o.value === saved)) select.value = saved;
    function load() {
      const url = new URL(GAME);
      if (select.value) url.searchParams.set('quality', select.value);
      url.searchParams.set('fps', '1');
      frame.src = separate.href = url.href;
    }
    select.addEventListener('change', () => {
      try { localStorage.setItem('dilldoe-hn-quality', select.value); } catch {}
      load();
    });
    load();
    document.getElementById('fullscreen').addEventListener('click', () => document.getElementById('stage').requestFullscreen?.());
    setTimeout(() => document.getElementById('note')?.remove(), 20000);
  </script>
</body>
</html>
