<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poppy Playtime · DillDoe</title><meta name="description" content="Play Poppy Playtime in your browser on DillDoe.">
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px Arial,sans-serif;color:#fff;background:linear-gradient(150deg,#2a1420,#0a0b12)}header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem;background:#0008}a{color:#bceaff}main{max-width:1280px;margin:1rem auto;padding:0 1rem}h1{font-size:clamp(2rem,6vw,4rem);margin:.5rem 0}button{cursor:pointer;background:#3fa9f5;color:#08121c;border:0;border-radius:.65rem;padding:.8rem 1.3rem;font-size:1rem;font-weight:700}#stage{display:none;position:relative;width:100%;aspect-ratio:16/9;background:#000;border:2px solid #ffffff4d;border-radius:.6rem;overflow:hidden}#stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}iframe{width:100%;height:100%;border:0}p{line-height:1.5;max-width:70ch}#fullscreen[hidden]{display:none}</style></head><body><header><a href="/games">&larr; Game Library</a><strong>Poppy Playtime</strong><button id="fullscreen" type="button" hidden>Fullscreen</button></header><main><section id="intro"><h1>Poppy Playtime</h1><p>The first load pulls about 48&nbsp;MB of game data, then it plays from the browser cache. It is the Unity web build, so it needs WebGL 2 and a few hundred megabytes of memory — a normal laptop or desktop is fine.</p><button id="play" type="button">Play game</button></section><div id="stage" aria-label="Poppy Playtime game"></div><p id="status" role="status"></p></main>
<script>const stage=document.getElementById('stage');document.getElementById('fullscreen').onclick=()=>stage.requestFullscreen();document.getElementById('play').onclick=()=>{const frame=document.createElement('iframe');frame.src='/ports/poppyplaytime/';frame.title='Poppy Playtime';frame.allow='fullscreen; autoplay; gamepad';frame.allowFullscreen=true;frame.onload=()=>document.getElementById('status').textContent='Game page loaded. The game may still be loading its data.';frame.onerror=()=>document.getElementById('status').textContent='The game could not load. Please retry.';stage.append(frame);stage.style.display='block';document.getElementById('intro').hidden=true;document.getElementById('fullscreen').hidden=false;document.getElementById('status').textContent='Loading game…';frame.focus()};</script></body></html>
