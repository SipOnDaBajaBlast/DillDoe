<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poppy Playtime · DillDoe</title><meta name="description" content="Play Poppy Playtime in your browser on DillDoe.">
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px Arial,sans-serif;color:#fff;background:linear-gradient(150deg,#2a1420,#0a0b12)}header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem;background:#0008}a{color:#bceaff}main{max-width:1280px;margin:1rem auto;padding:0 1rem}h1{font-size:clamp(2rem,6vw,4rem);margin:.5rem 0}button{cursor:pointer;background:#3fa9f5;color:#08121c;border:0;border-radius:.65rem;padding:.8rem 1.3rem;font-size:1rem;font-weight:700}#stage{display:none;position:relative;width:100%;aspect-ratio:16/9;background:#000;border:2px solid #ffffff4d;border-radius:.6rem;overflow:hidden}#stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}iframe{width:100%;height:100%;border:0}p{line-height:1.5;max-width:70ch}#status{color:#d9d2e4;font-variant-numeric:tabular-nums}#fullscreen[hidden]{display:none}</style></head><body><header><a href="/games">&larr; Game Library</a><strong>Poppy Playtime</strong><button id="fullscreen" type="button" hidden>Fullscreen</button></header><main><section id="intro"><h1>Poppy Playtime</h1><p>The first load pulls about 50&nbsp;MB of game data, then it plays from the browser cache. It is the Unity web build, so it needs WebGL 2 and a few hundred megabytes of memory — a normal laptop or desktop is fine.</p><button id="play" type="button">Play game</button></section><div id="stage" aria-label="Poppy Playtime game"></div><p id="status" role="status"></p></main>
<script>
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const megabytes = bytes => ((bytes || 0) / 1048576).toFixed(1);
const timeLeft = seconds => seconds == null || !isFinite(seconds) ? 'estimating time remaining'
  : seconds < 1.5 ? 'almost ready'
  : seconds < 60 ? `about ${Math.round(seconds)} s left`
  : `about ${Math.round(seconds / 60)} min left`;
let player = null;
let ticker = null;
let startingSince = 0;

// The game page downloads the bundles itself, so read its progress to keep this page's status honest
// instead of claiming the game is loading with no idea how far along it is.
function watchProgress() {
  clearInterval(ticker);
  ticker = setInterval(() => {
    let stats = null;
    try { stats = player && player.contentWindow && player.contentWindow.poppyLoading; } catch (error) { stats = null; }
    if (!stats) return;
    if (stats.failed) {
      statusEl.textContent = `Game files could not load: ${stats.failed}`;
      clearInterval(ticker);
    } else if (stats.phase === 'starting') {
      if (!startingSince) startingSince = Date.now();
      if (Date.now() - startingSince > 12000) {
        statusEl.textContent = `Ready — ${megabytes(stats.total)} MB loaded.`;
        clearInterval(ticker);
      } else {
        statusEl.textContent = `Downloaded ${megabytes(stats.total)} MB — starting the game…`;
      }
    } else if (stats.loaded > 0) {
      statusEl.textContent = `Downloading ${megabytes(stats.loaded)} MB of ${megabytes(stats.total)} MB (${Math.round(stats.percent || 0)}%)`
        + `${stats.speed > 0 ? ` · ${megabytes(stats.speed)} MB/s` : ''} — ${timeLeft(stats.eta)}`;
    }
  }, 400);
}

document.getElementById('fullscreen').onclick = () => stage.requestFullscreen();
document.getElementById('play').onclick = () => {
  const frame = document.createElement('iframe');
  player = frame;
  frame.src = '/ports/poppyplaytime/';
  frame.title = 'Poppy Playtime';
  frame.allow = 'fullscreen; autoplay; gamepad';
  frame.allowFullscreen = true;
  frame.onload = () => { statusEl.textContent = 'Downloading game files…'; watchProgress(); };
  frame.onerror = () => { statusEl.textContent = 'The game could not load. Please retry.'; };
  stage.append(frame);
  stage.style.display = 'block';
  document.getElementById('intro').hidden = true;
  document.getElementById('fullscreen').hidden = false;
  statusEl.textContent = 'Loading game…';
  frame.focus();
};
</script></body></html>
