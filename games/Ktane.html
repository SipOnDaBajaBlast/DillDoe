<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keep Talking and Nobody Explodes</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a11;
      --panel: #151827;
      --accent: #7ed0ff;
      --text: #edf6ff;
      --muted: #a9b7c6;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #16223a 0%, var(--bg) 40%, #05070d 100%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .panel {
      width: min(680px, 100%);
      background: rgba(21, 24, 39, 0.9);
      border: 1px solid rgba(126, 208, 255, 0.35);
      border-radius: 18px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.4);
      padding: 28px 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 20px;
      font-size: 1.05rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(180deg, #8ee3ff 0%, #65bfff 100%);
      color: #07273f;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(101, 191, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(101, 191, 255, 0.44);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Keep Talking and Nobody Explodes</h1>
    <p>
      This game is hosted on a separate site and cannot be embedded in an iframe from this domain because of browser security restrictions.
      Click below to open it in a new tab.
    </p>
    <a
      class="button"
      href="https://ktane-webport-m9hld579e-acme-1f57.vercel.app/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Open KTANE
    </a>
  </main>
</body>
</html>
