```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox 2016 Client</title>

<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>

:root {
    --bg-color: #121212;
    --card-bg: #1e1b18;
    --text-white: #f1f1f1;
    --text-grey: #8a8580;
    --paper-brown: #3d342b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-white);
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* BACKGROUND MEMES */

.meme {
    position: fixed;
    width: 120px;
    height: 120px;
    object-fit: contain;
    opacity: 0.15;
    pointer-events: none;
    z-index: -1;
}

.nyan {
    top: 10%;
    left: 5%;
    animation: float1 7s infinite ease-in-out;
}

.doge {
    top: 65%;
    right: 5%;
    animation: float2 8s infinite ease-in-out;
}

.troll {
    bottom: 5%;
    left: 10%;
    animation: float1 9s infinite ease-in-out;
}

.bart {
    top: 30%;
    right: 12%;
    animation: float2 6s infinite ease-in-out;
}

@keyframes float1 {
    0%, 100% {
        transform: translateY(0px) rotate(0deg);
    }

    50% {
        transform: translateY(-25px) rotate(5deg);
    }
}

@keyframes float2 {
    0%, 100% {
        transform: translateY(0px) rotate(0deg);
    }

    50% {
        transform: translateY(25px) rotate(-5deg);
    }
}

/* HEADER */

header {
    text-align: center;
    padding: 45px 20px 25px;
}

header h1 {
    font-family: "Metal Mania", cursive;
    font-size: 55px;
    margin: 0;
    color: #ffffff;
    text-shadow:
        4px 4px 0px #000,
        0px 0px 15px rgba(255,255,255,0.15);
}

header p {
    font-family: "Permanent Marker", cursive;
    color: var(--text-grey);
    font-size: 18px;
    margin-top: 10px;
}

/* BACK BUTTON */

.back-button {
    display: inline-block;
    margin: 10px 0 25px;
    padding: 10px 18px;

    background: #1e1b18;
    border: 2px solid #3d342b;
    border-radius: 8px;

    color: white;
    text-decoration: none;
    font-weight: bold;

    transition: 0.2s;
}

.back-button:hover {
    background: #3d342b;
    border-color: #ffffff;
    transform: translateY(-2px);
}

/* OPTIONS */

.options {
    max-width: 1100px;
    margin: 30px auto 80px;

    padding: 0 25px;

    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
}

/* OPTION CARDS */

.option-card {
    min-height: 260px;

    background: linear-gradient(
        145deg,
        #292522,
        #171513
    );

    border: 3px solid #3d342b;
    border-radius: 15px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    text-decoration: none;
    color: white;

    padding: 35px;

    box-shadow:
        0px 8px 25px rgba(0,0,0,0.5);

    transition:
        transform 0.25s,
        border-color 0.25s,
        background 0.25s,
        box-shadow 0.25s;
}

.option-card:hover {
    transform: translateY(-8px) scale(1.02);

    border-color: white;

    background: linear-gradient(
        145deg,
        #35302c,
        #1d1a18
    );

    box-shadow:
        0px 15px 35px rgba(0,0,0,0.7);
}

/* RED GAME FILES CARD */

.files-card {
    background: linear-gradient(
        145deg,
        #7a0000,
        #350000
    );

    border-color: #ff1a1a;
}

.files-card:hover {
    background: linear-gradient(
        145deg,
        #990000,
        #470000
    );

    border-color: white;

    box-shadow:
        0px 15px 35px rgba(255,0,0,0.45);
}

/* ICON */

.card-icon {
    font-size: 75px;
    margin-bottom: 15px;

    filter:
        drop-shadow(3px 3px 0px #000);
}

/* CARD TITLE */

.card-title {
    font-family: "Metal Mania", cursive;

    font-size: 38px;

    text-shadow:
        3px 3px 0px #000;

    margin-bottom: 8px;
}

/* CARD DESCRIPTION */

.card-description {
    font-family: "Permanent Marker", cursive;

    color: #c8c3bd;

    font-size: 16px;
}

/* MOBILE */

@media (max-width: 700px) {

    header h1 {
        font-size: 40px;
    }

    .options {
        grid-template-columns: 1fr;
    }

    .option-card {
        min-height: 230px;
    }

}

</style>
</head>

<body>

<!-- BACKGROUND MEMES -->

<img
    class="meme nyan"
    src="https://freepngimg.com/save/15407-nyan-cat-picture/512x512"
    alt=""
>

<img
    class="meme doge"
    src="https://pngimg.com/uploads/doge_meme/doge_meme_PNG112723.png"
    alt=""
>

<img
    class="meme troll"
    src="https://www.pngkey.com/png/full/22-226917_memes-unhappy-troll-sticker-sad-trollface.png"
    alt=""
>

<img
    class="meme bart"
    src="https://www.nicepng.com/png/full/136-1362322_sad-simpsons-and-bart-image-bart-simpson-sad.png"
    alt=""
>


<header>

    <a href="../index.html" class="back-button">
        ← BACK TO GAME LIBRARY
    </a>

    <h1>ROBLOX 2016 CLIENT</h1>

    <p>Choose an option</p>

</header>


<main class="options">

    <!-- GAME FILES -->

    <a
        href="https://github.com/beagleded/Roblox-Places-Archive"
        target="_blank"
        rel="noopener noreferrer"
        class="option-card files-card"
    >

        <div class="card-icon">
            📁
        </div>

        <div class="card-title">
            GAME FILES
        </div>

        <div class="card-description">
            Open the Roblox game archive
        </div>

    </a>


    <!-- ROBLOX CLIENT -->

    <a
        href="robloxclient2016.html"
        class="option-card"
    >

        <div class="card-icon">
            🎮
        </div>

        <div class="card-title">
            ROBLOX CLIENT
        </div>

        <div class="card-description">
            Open the Roblox 2016 client page
        </div>

    </a>

</main>

</body>
</html>
