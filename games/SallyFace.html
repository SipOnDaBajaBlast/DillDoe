<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px Arial,sans-serif;color:#fff;background:linear-gradient(150deg,#20243f,#080b17)}header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem;background:#0008}a{color:#bceaff}main{max-width:1280px;margin:1rem auto;padding:0 1rem}h1{font-size:clamp(2rem,6vw,4rem);margin:.5rem 0}button{cursor:pointer;background:#5558a7;color:#161620;border:0;border-radius:.65rem;padding:.8rem 1.3rem;font-size:1rem;font-weight:700}#stage{display:none;position:relative;width:100%;aspect-ratio:16/9;background:#000;border:2px solid #ffffff4d;border-radius:.6rem;overflow:hidden}#stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}iframe{width:100%;height:100%;border:0}p{line-height:1.5;max-width:70ch}#fullscreen[hidden]{display:none}</style></head><body><header><a href="/games">← Game Library</a><strong>Sally Face</strong><button id="fullscreen" type="button" hidden>Fullscreen</button></header><main><section id="intro"><h1>Sally Face</h1><p>The first play downloads about 247 MB. Arrow keys or WASD, mouse, and keyboard controls depend on the game.</p><button id="play" type="button">Play game</button><p>SALYY FACE </a></p></section><div id="stage" aria-label="Sally Face game"></div><p id="status" role="status"></p></main>
