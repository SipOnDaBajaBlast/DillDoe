<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket League · DillDoe</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; aspect-ratio: 1280 / 720; width: 100%; height: auto; outline: none; }
    @media (min-aspect-ratio: 1280 / 720) { canvas { width: auto; height: 100%; } }
    #status { position: fixed; left: 16px; bottom: 12px; font: 13px system-ui, sans-serif; color: #9a9a9a; pointer-events: none; }
    #fps { position: fixed; left: 8px; top: 6px; font: 600 13px ui-monospace, Consolas, monospace; color: #e8e8e8; background: #000a;
           padding: 2px 6px; border-radius: 4px; pointer-events: none; display: none; }
    #account { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, #10213f 0%, #000 70%);
               font: 15px system-ui, sans-serif; color: #e8eefc; z-index: 10; }
    #account .card { width: min(360px, calc(100vw - 32px)); padding: 28px 24px; border-radius: 12px; background: #0c1730e6;
                     border: 1px solid #2c4a80; box-shadow: 0 10px 40px #0008; display: grid; gap: 12px; }
    #account h1 { margin: 0; font-size: 20px; font-weight: 650; }
    #account label { font-size: 13px; color: #9fb3d9; }
    #account input { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #36598f; background: #050c1a; color: inherit; outline: none; }
    #account input:focus { border-color: #4f8dff; }
    #account button { font: inherit; font-weight: 600; padding: 10px; border-radius: 8px; border: 0; background: #2f6fe8; color: #fff; cursor: pointer; }
    #account button:disabled { background: #2a3a5c; color: #8193b6; cursor: default; }
    #account .hint { min-height: 1em; font-size: 12px; color: #ff9b8a; }
    #account .id { font-size: 12px; color: #6f83a8; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
  <div id="status">Loading…</div>
  <div id="fps"></div>
  <form id="account" autocomplete="off">
    <div class="card">
      <h1>Rocket League</h1>
      <label for="player-name">Player name</label>
      <input id="player-name" maxlength="20" spellcheck="false" placeholder="Your name">
      <div class="hint"></div>
      <button type="submit">Play</button>
      <div class="id"></div>
    </div>
  </form>
  <script>
  (() => {
    "use strict";
    const query = new URLSearchParams(location.search);
    // The player code is served from the game-files project; the 41 GB asset tree streams from its own host.
    const GAME_FILES = (query.get("gamefiles") || "https://dilldoe-gamefiles.pages.dev").replace(/\/+$/, "");
    const status = document.getElementById("status");
    const box = document.getElementById("account");
    const input = box.querySelector("input");
    const button = box.querySelector("button");
    const hint = box.querySelector(".hint");
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

    // What the cooperative build needs: WebGPU, JSPI threads and 64-bit wasm memory.
    const unsupported = !window.isSecureContext ? "Open this page over HTTPS: browsers only offer WebGPU there."
      : !("gpu" in navigator) ? "This game needs WebGPU. Use a current desktop Chrome or Edge."
      : typeof WebAssembly.Suspending !== "function" ? "This game needs WebAssembly JSPI. Use Chrome or Edge 137 or later."
      : !WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 5, 3, 1, 4, 0])) ? "This game needs 64-bit WebAssembly memory (memory64). Use Chrome or Edge 133 or later."
      : "";
    if (unsupported) {
      button.disabled = true;
      input.disabled = true;
      hint.textContent = unsupported;
      status.textContent = "";
    }

    const loader = document.createElement("script");
    loader.src = GAME_FILES + "/ports/rocket-league/loader.js?v=1";
    loader.onerror = () => { status.textContent = "The Rocket League player could not be reached."; };
    loader.onload = () => {
      status.textContent = "";
      const NAME_KEY = "uewUserName", ID_KEY = "uewUserId";
      const load = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
      const save = (key, value) => { try { localStorage.setItem(key, value); } catch (e) {} };
      let id = Number(load(ID_KEY)) | 0;
      if (id <= 0) {
        const r = new Uint32Array(1);
        crypto.getRandomValues(r);
        id = (r[0] & 0x7fffffff) || 1;
        save(ID_KEY, String(id));
      }
      box.querySelector(".id").textContent = "Player ID " + id;
      const valid = name => /^[A-Za-z0-9 _.\-]{2,20}$/.test(name) && name.trim().length >= 2;
      const check = () => {
        const ok = valid(input.value.trim());
        button.disabled = !ok || !!unsupported;
        hint.textContent = ok || !input.value ? "" : "2 to 20 letters, numbers, spaces, _ - or .";
      };
      input.value = load(NAME_KEY) || "";
      input.addEventListener("input", check);
      box.addEventListener("submit", e => {
        e.preventDefault();
        const name = input.value.trim();
        if (!valid(name) || unsupported) return;
        save(NAME_KEY, name);
        window.Module.uewUserName = name;
        window.Module.uewUserId = id;
        box.remove();
        const game = document.createElement("script");
        game.src = GAME_FILES + "/ports/rocket-league/game.js?v=1";
        document.body.appendChild(game);
        document.getElementById("canvas").focus();
      });
      check();
      if (!unsupported) { input.focus(); input.select(); }
    };
    document.body.appendChild(loader);
  })();
  </script>
</body>
</html>
