<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18191c">
  <title>Webblox · DillDoe</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #18191c; }
    #stage { position: fixed; inset: 0; background: #18191c; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #options { position: fixed; z-index: 5; top: 10px; right: 10px; display: flex; gap: 8px; }
    #options a, #options button { border: 1px solid #ffffff66; border-radius: 8px; padding: 8px 12px; color: white; background: #101722dd; font: 14px system-ui,sans-serif; text-decoration: none; cursor: pointer; }
    #note { position: fixed; z-index: 4; left: 12px; bottom: 12px; max-width: 34em; margin: 0; padding: 8px 12px; border-radius: 8px; background: #101722cc; color: #d5dbe6; font: 13px/1.4 system-ui,sans-serif; }
  </style>
</head>
<body>
  <!-- Webblox needs shared memory, so the worker serves this page and /blox/ cross-origin isolated (cloudflare/lib/wisp.mjs). -->
  <main id="stage" aria-label="Webblox"><iframe id="game" src="/blox/" title="Webblox" allow="cross-origin-isolated; fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe></main>
  <p id="note" role="status">Search for a game or paste a roblox.com game link. Joining needs your Roblox sign-in; the engine downloads from Roblox on first launch. Works best in Chrome or Edge.</p>
  <nav id="options" aria-label="Game options"><a href="/games">Game library</a><a id="separate" href="/blox/" target="_blank" rel="noopener">Open separately</a><button id="fullscreen" type="button">Fullscreen</button></nav>
  <script>
    const frame = document.getElementById('game');
    document.getElementById('fullscreen').addEventListener('click', () => document.getElementById('stage').requestFullscreen?.());
    // Open separately keeps the game the player picked inside the frame.
    document.getElementById('separate').addEventListener('click', event => {
      try { event.currentTarget.href = frame.contentWindow.location.href; } catch {}
    });
    setTimeout(() => document.getElementById('note')?.remove(), 15000);
  </script>
</body>
</html>
