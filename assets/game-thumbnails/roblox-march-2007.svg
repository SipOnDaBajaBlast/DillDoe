  <circle cx="395" cy="42" r="72" fill="#ffd21f" opacity="0.13"/>
  <path d="M350 184 370 116 438 136 418 204Z" fill="#e7edf0" stroke="#ffffff" stroke-width="4"/>
  <path d="M378 164 386 138 420 148 412 174Z" fill="#d13b32"/>
  <path d="M350 184 418 204 410 220 342 200Z" fill="#aab9c2"/>
  <text x="38" y="106" fill="#ffffff" font-family="Arial Black, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-3">ROBLOX</text>
  <rect x="38" y="128" width="148" height="35" rx="5" fill="#d13b32"/>
  <text x="48" y="152" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">MARCH 2007</text>
  <text x="40" y="205" fill="#d8eaf3" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">CLASSIC BROWSER PORT</text>
  <line x1="38" y1="217" x2="250" y2="217" stroke="#ffd21f" stroke-width="3"/>
  <text x="40" y="237" fill="#9fc4d6" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">BUILD 0.3.368 · WEBGL · NO INSTALL</text>
