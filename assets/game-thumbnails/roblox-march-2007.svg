<svg xmlns="http://www.w3.org/2000/svg" width="456" height="256" viewBox="0 0 456 256" role="img" aria-labelledby="title desc">
  <title id="title">Roblox (March 2007)</title>
  <desc id="desc">A retro blue browser-game card with the Roblox wordmark and a 2007 date badge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2338"/>
      <stop offset="0.55" stop-color="#174766"/>
      <stop offset="1" stop-color="#2d718d"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf6fb"/>
      <stop offset="1" stop-color="#b9d4e1"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="456" height="256" fill="url(#bg)"/>
