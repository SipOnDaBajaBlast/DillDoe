name: Update Deltarune

on:
  workflow_dispatch:
  push:
    branches: [App]
    paths:
      - '.github/workflows/deltarune.yml'
      - 'deltarune-pin.txt'

permissions:
  contents: read

concurrency:
  group: deltarune-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Read pinned revision
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < deltarune-pin.txt)" >> "$GITHUB_OUTPUT"
      - name: Download Deltarune
        run: |
          curl -fsSL --retry 3 -o /tmp/deltarune.tar.gz "https://codeload.github.com/ThePenguin-developer/deltaruneWASM/tar.gz/${{ steps.pin.outputs.sha }}"
          mkdir -p dist-deltarune
          tar -xzf /tmp/deltarune.tar.gz -C dist-deltarune --strip-components=1
      - name: Prepare static site
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'dist-deltarune';
          // The original page only embeds someone else's copy. Point it at our own menu.
          fs.writeFileSync(path.join(root, 'deltarune.html'), '<!doctype html><meta http-equiv="refresh" content="0; url=./">');
          fs.rmSync(path.join(root, 'tagmanager.js'), { force: true });
          for (const file of walk(root)) {
            if (!file.endsWith('.html')) continue;
            let html = fs.readFileSync(file, 'utf8');
            const relative = path.relative(root, path.dirname(file)).split(path.sep).join('/');
            const baseHref = relative ? `/${relative}/` : '/';
            // The original pages point their base at a CDN. Keep every asset on our own origin.
            html = html.replace(/<base\b[^>]*>/gi, '');
            html = html.replace(/<head\b[^>]*>/i, head => `${head}\n    <base href="${baseHref}">`);
            html = html.replace(/<script[^>]*src="tagmanager\.js"[^>]*><\/script>/g, '');
            html = html.replace(/<script>\s*window\.dataLayer[\s\S]*?<\/script>/g, '');
            html = html.replace(/<script\b[^>]*\bsrc="[^"]*adsbygoogle\.js"[^>]*>\s*<\/script>/gi, '');
            html = html.replace(/alert\('PRESS F4 2 TIMES[^']*'\);?/g, '');
            fs.writeFileSync(file, html);
          }
          fs.writeFileSync(path.join(root, '_headers'), [
            '/*',
            '  Cross-Origin-Opener-Policy: same-origin',
            '  Cross-Origin-Embedder-Policy: require-corp',
            '  Cross-Origin-Resource-Policy: same-origin',
            '  X-Content-Type-Options: nosniff',
            '  Permissions-Policy: fullscreen=(self), gamepad=(self)',
            '',
            '/*.wasm',
            '  Content-Type: application/wasm',
            '',
            '/index.html',
            '  Cache-Control: no-cache',
            '',
            '/chapter*/index.html',
            '  Cache-Control: no-cache',
            ''
          ].join('\n'));
          function* walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) yield* walk(full);
              else yield full;
            }
          }
          NODE
      - name: Install deploy tooling
        working-directory: cloudflare
        run: npm ci
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const account = '7d0845823ccbb7316078275c24c2658c';
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects`;
          const headers = {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json'};
          const name = 'dilldoe-deltarune';
          const current = await fetch(`${base}/${name}`, {headers, signal: AbortSignal.timeout(30000)});
          const existing = await current.json();
          if (current.ok && existing.success) console.log(`${name} is available.`);
          else if (current.status === 404 || existing.errors?.some(error => error.code === 8000007)) {
            const created = await fetch(base, {method: 'POST', headers, body: JSON.stringify({name, production_branch: 'main'}), signal: AbortSignal.timeout(30000)});
            const result = await created.json();
            if (!created.ok || !result.success) throw new Error('Cloudflare project creation failed: ' + JSON.stringify(result.errors));
            console.log(`Created ${name}.pages.dev.`);
          } else throw new Error('Cloudflare project check failed: ' + JSON.stringify(existing.errors));
          NODE
      - name: Publish Deltarune
        working-directory: cloudflare
        run: npx wrangler pages deploy ../dist-deltarune --project-name dilldoe-deltarune --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: 7d0845823ccbb7316078275c24c2658c
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
