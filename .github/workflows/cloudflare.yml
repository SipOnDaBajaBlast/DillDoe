name: Update website

on:
  push:
    branches: [App]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Restore Cloudflare project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.cloudflare.com/client/v4/accounts/7d0845823ccbb7316078275c24c2658c/pages/projects';
          const headers = {Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN, 'Content-Type': 'application/json'};
          const current = await fetch(base + '/dilldoe-games', {headers, signal: AbortSignal.timeout(30000)});
          const existing = await current.json();
          if (current.ok && existing.success) {
            console.log('Cloudflare project is available.');
          } else if (current.status === 404 || existing.errors?.some(error => error.code === 8000007)) {
            const created = await fetch(base, {method: 'POST', headers, body: JSON.stringify({name: 'dilldoe-games', production_branch: 'main'}), signal: AbortSignal.timeout(30000)});
            const result = await created.json();
            if (!created.ok || !result.success) throw new Error('Cloudflare project creation failed: ' + JSON.stringify(result.errors));
            console.log('Restored dilldoe-games.pages.dev.');
          } else throw new Error('Cloudflare project check failed: ' + JSON.stringify(existing.errors));
          NODE
      - name: Publish website
        run: npx wrangler pages deploy dist --project-name dilldoe-games --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: 7d0845823ccbb7316078275c24c2658c
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Check live website
        run: node verify-published.mjs
