name: Update website

on:
  push:
    branches: [App]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Publish website
        run: npx wrangler pages deploy dist --project-name dilldoe-games --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: 7d0845823ccbb7316078275c24c2658c
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Check live website
        run: node verify-published.mjs
