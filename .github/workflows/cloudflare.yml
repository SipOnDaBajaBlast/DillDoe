name: Update website

on:
  push:
    branches: [App]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v6
      - name: Make room for static game assets
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            cloudflare/.asset-cache/archives
            cloudflare/.asset-cache/packs
          key: game-sources-v1-${{ hashFiles('cloudflare/lib/game-catalog.json', 'cloudflare/lib/game-assets.json') }}
      - run: npm run build
      - name: Bound the reusable build cache
        run: node prune-build-cache.mjs
      - name: Restore Cloudflare project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.cloudflare.com/client/v4/accounts/7d0845823ccbb7316078275c24c2658c/pages/projects';
          const headers = {Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN, 'Content-Type': 'application/json'};
          for (const name of ['dilldoe-games','dilldoe-gamefiles']) {
            const current = await fetch(base + '/' + name, {headers, signal: AbortSignal.timeout(30000)});
            const existing = await current.json();
            if (current.ok && existing.success) console.log(name + ' is available.');
            else if (current.status === 404 || existing.errors?.some(error => error.code === 8000007)) {
              const created = await fetch(base, {method: 'POST', headers, body: JSON.stringify({name, production_branch: 'main'}), signal: AbortSignal.timeout(30000)});
              const result = await created.json();
              if (!created.ok || !result.success) throw new Error('Cloudflare project creation failed: ' + JSON.stringify(result.errors));
              console.log('Created ' + name + '.pages.dev.');
            } else throw new Error('Cloudflare project check failed: ' + JSON.stringify(existing.errors));
          }
          NODE
      - name: Publish static game files
        run: npx wrangler pages deploy dist-games --project-name dilldoe-gamefiles --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: 7d0845823ccbb7316078275c24c2658c
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Publish website
        run: npx wrangler pages deploy dist --project-name dilldoe-games --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: 7d0845823ccbb7316078275c24c2658c
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Check live website
        run: node verify-published.mjs
