<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOLS.EXE</title>

    <!-- Early 2000s Frutiger Aero Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Trebuchet+MS&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-dark: #072a4a;
            --aqua-blue: #00a8ff;
            --aqua-green: #00e676;
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-shine: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 51%, rgba(255,255,255,0.25) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Early 2000s Clear Blue Aqua Mouse Cursor */
            cursor: url('https://skeuoss.net/cdn/shop/files/aqua-mouse-clear-blue-main.webp?v=1722070790&width=1946'), auto !important;
        }

        body {
            /* Frutiger Aero Sky & Nature Background */
            background: #80d2ff url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWn06EKF4l8vPj4NNF6Da7XtkAnR3tWl_K3fZQLjvSwSJVmlqV6jLgFHX6&s=10') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Trebuchet MS', 'Segoe UI', 'Lucida Grande', Tahoma, sans-serif;
            transition: opacity 0.4s ease;
            position: relative;
            user-select: none;
        }

        /* --- WATER RIPPLE OVERLAY --- */
        .water-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 168, 255, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
            z-index: 1;
            animation: waterPulse 6s ease-in-out infinite alternate;
        }

        @keyframes waterPulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.08); opacity: 0.9; }
        }

        /* --- GRASS BOTTOM BORDER --- */
        .grass-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: linear-gradient(0deg, #1b8a00 0%, #3cd000 60%, rgba(60, 208, 0, 0) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* --- BACKGROUND CAT IMAGES --- */
        .bg-cat {
            position: absolute;
            z-index: 3;
            pointer-events: none;
            user-select: none;
        }

        /* Dancing Kitten - Bottom Left */
        .bg-cat-kitten {
            bottom: 15px;
            left: 25px;
            width: 250px;
            max-width: 30vw;
            opacity: 0.95;
            filter: drop-shadow(0px 10px 20px rgba(0, 60, 120, 0.4));
        }

        /* Nyan Cat - Top Right */
        .bg-cat-nyan {
            top: 10%;
            right: 35px;
            width: 290px;
            max-width: 35vw;
            opacity: 0.95;
            filter: drop-shadow(0px 0px 25px rgba(255, 255, 255, 0.9));
            animation: float-cat 4s ease-in-out infinite alternate;
        }

        @keyframes float-cat {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-18px) rotate(4deg); }
        }

        /* --- RISING FRUTIGER BUBBLES --- */
        .bubble {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.25) 60%, rgba(0, 168, 255, 0.5));
            border-radius: 50%;
            box-shadow: inset -2px -2px 6px rgba(0, 40, 80, 0.2), inset 2px 2px 8px rgba(255,255,255,0.9), 0 4px 12px rgba(0,100,200,0.25);
            pointer-events: none;
            z-index: 2;
            animation: rise 9s infinite linear;
        }

        @keyframes rise {
            0% { transform: translateY(105vh) scale(0.7); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        body.fade-out {
            opacity: 0;
        }

        /* --- MAIN AERO GLASS WINDOW CONTAINER --- */
        .aero-window {
            position: absolute;
            width: 90%;
            max-width: 620px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 60, 130, 0.35), inset 0 1.5px 3px rgba(255, 255, 255, 0.95);
            z-index: 10;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: none;
            transition: box-shadow 0.2s ease, background 0.3s ease;
        }

        .aero-window.is-dragging {
            box-shadow: 0 30px 70px rgba(0, 80, 180, 0.5), inset 0 1.5px 3px rgba(255, 255, 255, 0.95);
        }

        /* Window Titlebar (Draggable Handle) */
        .window-titlebar {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.85) 0%, rgba(200, 235, 255, 0.6) 45%, rgba(120, 195, 255, 0.7) 50%, rgba(175, 225, 255, 0.8) 100%);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);
            cursor: grab !important;
        }

        .window-titlebar:active {
            cursor: grabbing !important;
        }

        .window-title-text {
            font-size: 0.85rem;
            font-weight: bold;
            color: #003366;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        /* Windows / Mac Control Buttons */
        .window-controls {
            display: flex;
            gap: 7px;
        }

        .win-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.25);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.8);
            cursor: pointer !important;
        }

        .win-close { background: linear-gradient(180deg, #ff7b7b, #e60000); }
        .win-min { background: linear-gradient(180deg, #ffea7b, #e6a100); }
        .win-max { background: linear-gradient(180deg, #7bff8a, #00c81b); }

        .window-content {
            padding: 35px 25px 40px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            background: var(--glass-shine);
        }

        /* --- HEADER & TITLE --- */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .metal-title {
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #d4efff 40%, #0099ff 50%, #004ba8 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(0, 70, 150, 0.45));
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9);
        }

        .subtitle {
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #004d99;
            margin-top: 4px;
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        /* --- MAIN & BUTTONS --- */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            width: 100%;
        }

        /* Web 2.0 Glossy Crystal Buttons */
        .tool-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 16px 50px;
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            font-weight: bold;
            font-size: 1.8rem;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer !important;
            border: 2px solid rgba(255, 255, 255, 0.9);
            text-align: center;
            width: 85%;
            max-width: 360px;
            border-radius: 50px;
            background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(0,168,255,0.9) 48%, rgba(0,85,179,0.98) 50%, rgba(0,130,225,1) 100%);
            box-shadow: 0 10px 25px rgba(0, 80, 160, 0.45), inset 0 2px 4px rgba(255, 255, 255, 1), inset 0 -2px 6px rgba(0, 0, 0, 0.25);
            text-shadow: 0 -1px 2px rgba(0, 30, 70, 0.8), 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: all 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Top Curved Gloss Highlight */
        .tool-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 5%;
            right: 5%;
            height: 48%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.1) 100%);
            border-radius: 50px 50px 10px 10px;
            pointer-events: none;
        }

        .back-btn {
            background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(120,130,140,0.9) 48%, rgba(60,70,80,0.98) 50%, rgba(80,90,100,1) 100%);
            box-shadow: 0 10px 25px rgba(40, 50, 60, 0.4), inset 0 2px 4px rgba(255, 255, 255, 1), inset 0 -2px 6px rgba(0, 0, 0, 0.25);
            text-shadow: 0 -1px 2px rgba(20, 20, 20, 0.8), 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .tool-btn:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 15px 32px rgba(0, 168, 255, 0.65), inset 0 2px 6px rgba(255, 255, 255, 1);
            filter: brightness(1.08);
        }

        .back-btn:hover {
            box-shadow: 0 15px 32px rgba(120, 130, 140, 0.65), inset 0 2px 6px rgba(255, 255, 255, 1);
        }

        .tool-btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 5px 15px rgba(0, 80, 160, 0.4), inset 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* Status Bar */
        .window-statusbar {
            background: rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            padding: 6px 14px;
            font-size: 0.75rem;
            color: #004080;
            display: flex;
            justify-content: space-between;
        }

        /* --- SECRET STEALTH MODE (PANIC MODE) --- */
        body.stealth-active {
            background: #f8f9fa !important;
        }
        body.stealth-active .water-overlay,
        body.stealth-active .grass-bottom,
        body.stealth-active .bubble,
        body.stealth-active .bg-cat {
            display: none !important;
        }
        body.stealth-active .aero-window {
            background: #ffffff !important;
            border: 1px solid #dadce0 !important;
            box-shadow: 0 1px 3px rgba(60,64,67,0.15) !important;
            border-radius: 8px !important;
            width: 95% !important;
            max-width: 800px !important;
        }
        body.stealth-active .window-titlebar {
            background: #ffffff !important;
            border-bottom: 1px solid #dadce0 !important;
        }
        body.stealth-active .window-title-text {
            color: #202124 !important;
            font-family: Arial, sans-serif !important;
        }
        body.stealth-active .window-content {
            background: #ffffff !important;
            padding: 20px !important;
            align-items: flex-start !important;
        }
        .stealth-doc {
            display: none;
            width: 100%;
            font-family: Arial, sans-serif;
            color: #202124;
            user-select: text !important;
        }
        body.stealth-active .stealth-doc {
            display: block;
        }
        body.stealth-active header,
        body.stealth-active main,
        body.stealth-active .window-statusbar {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- WATER OVERLAY -->

    <div class="aero-window" id="aeroWindow">
        <!-- Title Bar (Draggable Handle) -->
        <div class="window-titlebar" id="windowTitlebar">

            </div>
            <div class="window-controls">
                <div class="win-btn win-min"></div>

        <!-- Inner Content -->
        <div class="window-content">

            </header>

            <!-- MAIN ACTION -->
            <main>

                    <a href="movies.html" class="tool-btn" onclick="navigateToPage(event, this.href)">MOVIES</a>
                    <a href="index.html" class="tool-btn back-btn" onclick="navigateToPage(event, this.href)">← HOME</a>

            <!-- SECRET STEALTH DOCUMENT -->

    <script>
        // Navigation function
        function navigateToPage(event, destinationUrl) {
            event.preventDefault();
            document.body.classList.add('fade-out');

            setTimeout(() => {
                window.location.href = destinationUrl;
            }, 300);
        }

        // Draggable Window Script
        const windowElem = document.getElementById('aeroWindow');
        const titlebarElem = document.getElementById('windowTitlebar');
        const windowTitleText = document.getElementById('windowTitleText');

        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        function startDrag(e) {
            if (e.target.classList.contains('win-btn')) return;

            isDragging = true;
            windowElem.classList.add('is-dragging');

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            const rect = windowElem.getBoundingClientRect();
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
        }

        function onDrag(e) {
            if (!isDragging) return;

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            let newX = clientX - offsetX;
            let newY = clientY - offsetY;

            const minX = 5;
            const minY = 5;
            const maxX = window.innerWidth - windowElem.offsetWidth - 5;
            const maxY = window.innerHeight - windowElem.offsetHeight - 5;

            newX = Math.max(minX, Math.min(newX, maxX));
            newY = Math.max(minY, Math.min(newY, maxY));

            windowElem.style.left = `${newX}px`;
            windowElem.style.top = `${newY}px`;
            windowElem.style.transform = 'none';
        }

        function stopDrag() {
            isDragging = false;
            windowElem.classList.remove('is-dragging');
        }

        titlebarElem.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);

        titlebarElem.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', onDrag);
        window.addEventListener('touchend', stopDrag);

        // --- SECRET TOGGLE (STEALTH MODE / PANIC KEY) ---
        function toggleStealthMode() {
            document.body.classList.toggle('stealth-active');
            if (document.body.classList.contains('stealth-active')) {
                windowTitleText.innerHTML = "📄 Google Docs - Project_Notes_Draft";
            } else {
                windowTitleText.innerHTML = "🌐 C:\\DOWNLOADS\\TOOLS.EXE";
            }
        }

        // Toggle on ESC key press
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                toggleStealthMode();
            }
        });

        // Toggle on Titlebar Double-Click
        titlebarElem.addEventListener('dblclick', toggleStealthMode);
    </script>
