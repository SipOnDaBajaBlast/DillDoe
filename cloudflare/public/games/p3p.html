<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persona 3 Portable</title>
  <style>
    /* Makes the iframe fill the entire screen */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe
    src="/ports/persona3-browser/?embed=1"
    title="Persona 3 Portable"
    allow="cross-origin-isolated; autoplay; fullscreen; gamepad"
    allowfullscreen
  ></iframe>

</body>
</html>
