<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyan Cat: Lost in Space</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#080b26;color:white;font-family:Arial,sans-serif;overflow:hidden}
    #game{width:100%;height:100%;display:grid;place-items:center}
    ruffle-player{width:100%;height:100%}
    #status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;pointer-events:none}
    #status[hidden]{display:none}
  </style>
</head>
<body>
  <main id="game" aria-label="Nyan Cat: Lost in Space"></main>
  <div id="status" role="status">Loading Nyan Cat…</div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener('load', async () => {
      const status = document.getElementById('status');
      try {
        const player = window.RufflePlayer.newest().createPlayer();
        document.getElementById('game').appendChild(player);
        await player.ruffle().load({
          url: './nyan-cat-lost-in-space.swf',
          autoplay: 'on',
          unmuteOverlay: 'visible',
          allowScriptAccess: false,
          allowFullscreen: true,
          backgroundColor: '#080b26'
        });
        status.hidden = true;
      } catch (error) {
        status.textContent = 'Could not load Nyan Cat. Refresh the page to try again.';
        console.error(error);
      }
    });
  </script>
  <script src="/ports/ruffle/ruffle.js"></script>
</body>
</html>
