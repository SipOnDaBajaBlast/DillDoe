<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dumbfire Demo · Browser Preview</title>
  <link rel="icon" href="TemplateData/favicon.ico">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px Arial,sans-serif}
    #game{width:100%;height:100%;display:block;outline:0}
    #loading{position:absolute;inset:0;display:grid;place-items:center;background:#000}
    #panel{width:min(82vw,420px);text-align:center}
    h1{font-size:32px;letter-spacing:.12em;color:#ffdb28}progress{width:100%;height:20px;accent-color:#ffdb28}
    #status{min-height:2.5em;line-height:1.5}#fullscreen{position:absolute;right:12px;top:12px;z-index:2;background:#151515;color:#fff;border:1px solid #888;padding:7px;cursor:pointer}
  </style>
</head>
<body>
  <button id="fullscreen" type="button">Fullscreen</button>
  <canvas id="game" tabindex="0"></canvas>
  <div id="loading"><div id="panel"><h1>DUMB FIRE</h1><p id="status" role="status">Preparing game data…</p><progress id="progress" max="1" value="0"></progress></div></div>
  <script src="Build/WebGL-preview.loader.js"></script>
  <script>
    const canvas=document.getElementById('game');
    const status=document.getElementById('status');
    const progress=document.getElementById('progress');
    const loading=document.getElementById('loading');
    let instance;
    document.getElementById('fullscreen').onclick=()=>instance&&instance.SetFullscreen(1);
    (async()=>{
      const response=await fetch('Build/data-parts.txt');
      if(!response.ok)throw new Error('Game manifest could not load (HTTP '+response.status+').');
      const manifest=await response.json();
      const chunks=[];
      for(let i=0;i<manifest.parts.length;i++){
        status.textContent=`Downloading game data ${i+1} of ${manifest.parts.length}…`;
        const part=await fetch('Build/'+manifest.parts[i]);
        if(!part.ok)throw new Error('Game data part '+(i+1)+' failed (HTTP '+part.status+').');
        chunks.push(await part.blob());
        progress.value=(i+1)/manifest.parts.length*.75;
      }
      const dataUrl=URL.createObjectURL(new Blob(chunks,{type:'application/octet-stream'}));
      status.textContent='Starting Unity game…';
      instance=await createUnityInstance(canvas,{
        dataUrl,
        frameworkUrl:'Build/WebGL-preview.framework.js.br',
        codeUrl:'Build/WebGL-preview.wasm.br',
        streamingAssetsUrl:'StreamingAssets',
        companyName:'DefaultCompany',productName:'DumbfireDemo',productVersion:'0.1.0',
        autoSyncPersistentDataPath:true,
        showBanner:(message,type)=>{if(type==='error')status.textContent=message;else console.warn(message);}
      },value=>{progress.value=.75+value*.25;});
      loading.remove();canvas.focus();
      URL.revokeObjectURL(dataUrl);
    })().catch(error=>{status.textContent='Could not start the game: '+error.message;console.error(error);});
  </script>
</body>
</html>
