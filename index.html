<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LOVE NYAN CAT <3</title>
    
    <!-- Early 2000s Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Trebuchet+MS&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.75);
            --text-dark: #0f2b48;
            --aqua-blue: #00a8ff;
            --aqua-green: #00e676;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Early 2000s Clear Blue Aqua Mouse Cursor */
            cursor: url('https://skeuoss.net/cdn/shop/files/aqua-mouse-clear-blue-main.webp?v=1722070790&width=1946'), auto !important;
        }

        body {
            /* Frutiger Aero Background Image */
            background: #a1dbff url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWn06EKF4l8vPj4NNF6Da7XtkAnR3tWl_K3fZQLjvSwSJVmlqV6jLgFHX6&s=10') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            font-family: 'Trebuchet MS', 'Lucida Grande', 'Segoe UI', Tahoma, sans-serif;
            transition: opacity 0.5s ease;
            position: relative;
        }

        /* --- BACKGROUND CAT IMAGES --- */
        .bg-cat {
            position: absolute;
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }

        /* Dancing Kitten - Bottom Left */
        .bg-cat-kitten {
            bottom: 10px;
            left: 20px;
            width: 250px;
            max-width: 30vw;
            opacity: 0.9;
            filter: drop-shadow(0px 8px 15px rgba(0, 80, 160, 0.4));
        }

        /* Nyan Cat - Top Right */
        .bg-cat-nyan {
            top: 12%;
            right: 30px;
            width: 280px;
            max-width: 35vw;
            opacity: 0.95;
            filter: drop-shadow(0px 0px 20px rgba(255, 255, 255, 0.8));
            animation: float-cat 4s ease-in-out infinite alternate;
        }

        @keyframes float-cat {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(3deg); }
        }

        /* --- FLOATING BUBBLES --- */
        .bubble {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.2) 60%, rgba(0, 168, 255, 0.4));
            border-radius: 50%;
            box-shadow: inset -2px -2px 6px rgba(0,0,0,0.1), inset 2px 2px 8px rgba(255,255,255,0.8), 0 4px 10px rgba(0,0,0,0.15);
            pointer-events: none;
            z-index: 1;
            animation: rise 10s infinite linear;
        }

        @keyframes rise {
            0% { transform: translateY(105vh) scale(0.8); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* --- LOADING SCREEN --- */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #d0f0ff 0%, #70c5ff 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loader-box {
            padding: 25px 50px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 100, 200, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .loader-text {
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 2.2rem;
            font-weight: bold;
            color: #0f3d68;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
            animation: pulse-glow 1.2s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .loaded #loader-wrapper {
            opacity: 0;
            visibility: hidden;
        }

        body.fade-out {
            opacity: 0;
        }

        /* --- HEADER & TITLE --- */
        header {
            margin-top: 8vh;
            text-align: center;
            z-index: 2;
        }

        .metal-title {
            font-family: 'Trebuchet MS', 'Lucida Grande', sans-serif;
            font-size: 4.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #e0f2fe 45%, #00a8ff 50%, #0055b3 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(0, 80, 160, 0.5));
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
        }

        .subtitle {
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #004080;
            margin-top: -5px;
            text-transform: uppercase;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        /* --- MAIN & BUTTONS --- */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            z-index: 2;
        }

        .button-container {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center;
        }

        /* Skeuomorphic Web 2.0 Glass Buttons */
        .start-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 18px 60px;
            font-family: 'Trebuchet MS', sans-serif;
            font-weight: bold;
            font-size: 2rem;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.9);
            text-align: center;
            min-width: 340px;
            border-radius: 50px;
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(0,168,255,0.85) 50%, rgba(0,85,179,0.95) 51%, rgba(0,120,215,1) 100%);
            box-shadow: 0 8px 25px rgba(0, 80, 160, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.9), inset 0 -2px 5px rgba(0, 0, 0, 0.2);
            text-shadow: 0 -1px 2px rgba(0, 40, 80, 0.8), 0 1px 2px rgba(0, 0, 0, 0.4);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Glossy Highlight Reflection */
        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.15) 100%);
            border-radius: 50px 50px 0 0;
            pointer-events: none;
        }

        .tools-btn {
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(0,230,118,0.85) 50%, rgba(0,168,80,0.95) 51%, rgba(0,180,90,1) 100%);
            box-shadow: 0 8px 25px rgba(0, 160, 80, 0.35), inset 0 2px 3px rgba(255, 255, 255, 0.9), inset 0 -2px 5px rgba(0, 0, 0, 0.2);
            text-shadow: 0 -1px 2px rgba(0, 60, 30, 0.8), 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 12px 30px rgba(0, 168, 255, 0.6), inset 0 2px 5px rgba(255, 255, 255, 1);
            filter: brightness(1.08);
        }

        .tools-btn:hover {
            box-shadow: 0 12px 30px rgba(0, 230, 118, 0.6), inset 0 2px 5px rgba(255, 255, 255, 1);
        }

        .start-btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 4px 15px rgba(0, 80, 160, 0.4), inset 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        footer {
            margin-bottom: 25px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- FLOATING BUBBLES -->
    <div class="bubble" style="width: 40px; height: 40px; left: 10%; animation-duration: 9s;"></div>
    <div class="bubble" style="width: 25px; height: 25px; left: 25%; animation-duration: 7s; animation-delay: 2s;"></div>
    <div class="bubble" style="width: 50px; height: 50px; left: 50%; animation-duration: 11s; animation-delay: 1s;"></div>
    <div class="bubble" style="width: 30px; height: 30px; left: 75%; animation-duration: 8s; animation-delay: 3s;"></div>
    <div class="bubble" style="width: 45px; height: 45px; left: 88%; animation-duration: 10s; animation-delay: 0.5s;"></div>

    <!-- BACKGROUND CAT IMAGES -->
    <img src="https://png.pngtree.com/png-vector/20240917/ourmid/pngtree-funny-kitten-cat-standing-or-dancing-isolated-png-image_13844217.png" alt="Dancing Kitten" class="bg-cat bg-cat-kitten">
    <img src="https://wallpapers.com/images/featured/nyan-cat-png-az8jeatasi3z7yda.png" alt="Nyan Cat" class="bg-cat bg-cat-nyan">

    <!-- LOADING SCREEN -->
    <div id="loader-wrapper">
        <div class="loader-box">
            <div class="loader-text">DILL DOH</div>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <h1 class="metal-title">DILL DOH | UNBLOCKED GAMES</h1>
        <p class="subtitle">(very funny name please laugh)</p>
    </header>

    <!-- MAIN ACTION -->
    <main>
        <div class="button-container">
            <a href="games.html" class="start-btn" onclick="navigateToPage(event, this.href)">Games</a>
            <a href="Tools.html" class="start-btn tools-btn" onclick="navigateToPage(event, this.href)">Fun Stuff!!!😊</a>
        </div>
    </main>

    <footer></footer>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 800);
        });

        function navigateToPage(event, destinationUrl) {
            event.preventDefault();
            document.body.classList.add('fade-out');

            setTimeout(() => {
                window.location.href = destinationUrl;
            }, 400);
        }
    </script>
</body>
</html>
