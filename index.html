<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DILLD NEW GAMES</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --accent-color: #e6e6e6;
            --lightning-color: #7df9ff;
            --lightning-glow: rgba(125, 249, 255, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            /* Grunge paper/concrete texture overlay */
            background-image: 
                radial-gradient(circle, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            color: var(--accent-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            transition: opacity 0.5s ease;
        }

        /* --- GRUNGE LIGHTNING LOADING SCREEN --- */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle, rgba(20,20,20,1) 0%, rgba(5,5,5,1) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        /* Distorted Metal Ring */
        .grunge-spinner {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #222;
            border-top: 4px solid var(--lightning-color);
            border-bottom: 4px solid #ff0055;
            filter: drop-shadow(0 0 15px var(--lightning-glow));
            animation: spin 0.8s linear infinite, flash 1.2s infinite alternate;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes flash {
            0%, 90%, 100% { opacity: 1; filter: drop-shadow(0 0 15px var(--lightning-glow)); }
            92%, 98% { opacity: 0.3; filter: drop-shadow(0 0 2px var(--lightning-glow)); }
        }

        .loading-text {
            margin-top: 30px;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--lightning-glow);
            animation: flicker 0.2s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.8; }
            100% { opacity: 1; text-shadow: 0 0 18px var(--lightning-color); }
        }

        .loaded #loader-wrapper {
            opacity: 0;
            visibility: hidden;
        }

        body.fade-out {
            opacity: 0;
        }

        /* --- HEAVY METAL LIGHTNING HEADER --- */
        header {
            margin-top: 12vh;
            text-align: center;
            position: relative;
        }

        .metal-title {
            font-size: 5.5rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-style: italic;
            /* Metallic Gradient */
            background: linear-gradient(180deg, #ffffff 0%, #a6a6a6 45%, #303030 50%, #8c8c8c 85%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Metal outline & Lightning Glow */
            filter: drop-shadow(2px 2px 0px #000) 
                    drop-shadow(-2px -2px 0px #000)
                    drop-shadow(0 0 15px var(--lightning-glow));
            animation: lightning-strike 2.5s infinite;
        }

        /* Electric Lightning Flash Animation */
        @keyframes lightning-strike {
            0%, 80%, 84%, 88%, 100% {
                filter: drop-shadow(0 0 10px var(--lightning-glow)) drop-shadow(0 0 20px var(--lightning-color));
            }
            82%, 86% {
                filter: drop-shadow(0 0 30px #ffffff) drop-shadow(0 0 60px var(--lightning-color));
            }
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        /* --- GRUNGE METAL BUTTON --- */
        .start-btn {
            position: relative;
            padding: 20px 70px;
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            background: linear-gradient(180deg, #2c2c2c 0%, #111111 100%);
            border: 3px solid #555;
            box-shadow: 0 0 15px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,255,255,0.2);
            cursor: pointer;
            outline: none;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease-in-out;
            transform: skew(-10deg); /* Metallic angled look */
        }

        .start-btn:hover {
            border-color: var(--lightning-color);
            color: var(--lightning-color);
            background: #1a1a1a;
            box-shadow: 0 0 25px var(--lightning-glow), inset 0 0 15px var(--lightning-glow);
            transform: skew(-10deg) scale(1.05);
        }

        .start-btn:active {
            transform: skew(-10deg) scale(0.98);
        }

        footer {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- LIGHTNING LOADING SCREEN -->
    <div id="loader-wrapper">
        <div class="grunge-spinner"></div>
        <div class="loading-text">Loading DillDoe...</div>
    </div>

    <!-- METAL TITLE WITH LIGHTNING EFFECT -->
    <header>
        <h1 class="metal-title">DillDoe</h1>
    </header>

    <!-- START BUTTON -->
    <main>
        <a href="games.html" class="start-btn" onclick="navigateToPage(event, this.href)">Start</a>
    </main>

    <footer></footer>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 1800);
        });

        function navigateToPage(event, destinationUrl) {
            event.preventDefault();
            document.body.classList.add('fade-out');

            setTimeout(() => {
                window.location.href = destinationUrl;
            }, 500);
        }
    </script>
</body>
</html>
