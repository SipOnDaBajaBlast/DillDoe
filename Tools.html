<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOLS.EXE</title>

    <!-- Horror & Metal Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Metal+Mania&family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --blood-red: #8b0000;
            --bright-red: #ff0000;
            --corrupt-green: #00ff66;
            --dark-void: #050203;
            --glass-horror: rgba(20, 5, 8, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair !important;
        }

        body {
            /* Your provided background image */
            background: #000 url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRidsvRX5V1092HP11qY6LYQcv2ogY2QRefbMYRWDrN_A&s') no-repeat center center fixed;
            background-size: cover;
            color: #f1f1f1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'VT323', monospace;
            position: relative;
            user-select: none;
            transition: opacity 0.4s ease;
        }

        /* CRT Scanline & Screen Noise Overlay */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.75) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.8;
        }

        /* Screen Glitch Flash */
        .horror-flash {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bright-red);
            opacity: 0;
            pointer-events: none;
            z-index: 19;
            animation: randomGlitch 8s infinite;
        }

        @keyframes randomGlitch {
            0%, 95%, 100% { opacity: 0; }
            96% { opacity: 0.12; }
            97% { opacity: 0.04; }
            98% { opacity: 0.25; }
        }

        /* --- CREEPYPASTA BACKGROUND ENTITIES --- */
        .creepypasta-entity {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            user-select: none;
        }

        /* BEN DROWNED */
        .entity-ben {
            top: 8%;
            left: 4%;
            width: 250px;
            max-width: 28vw;
            opacity: 0.85;
            filter: drop-shadow(0 0 15px #ff0000) contrast(130%);
            animation: floatBen 5s ease-in-out infinite alternate;
        }

        @keyframes floatBen {
            0% { transform: translateY(0) scale(1) rotate(-2deg); }
            100% { transform: translateY(-18px) scale(1.05) rotate(2deg); }
        }

        /* JEFF THE KILLER */
        .entity-jeff {
            bottom: -10px;
            right: 3%;
            width: 280px;
            max-width: 30vw;
            opacity: 0.85;
            filter: contrast(140%) drop-shadow(-5px -5px 20px #8b0000);
            animation: twitchJeff 4s infinite alternate;
        }

        @keyframes twitchJeff {
            0%, 90% { transform: scale(1); }
            92% { transform: scale(1.04) skewX(4deg); }
            95% { transform: scale(0.98); }
        }

        /* SLENDERMAN */
        .entity-slender {
            top: 5%;
            right: 22%;
            height: 80vh;
            opacity: 0.4;
            filter: blur(1px) contrast(180%);
            animation: fadeSlender 7s ease-in-out infinite alternate;
        }

        @keyframes fadeSlender {
            0% { opacity: 0.25; transform: scaleX(1); }
            100% { opacity: 0.55; transform: scaleX(1.05); }
        }

        body.fade-out {
            opacity: 0;
        }

        /* --- CORRUPTED DRAGGABLE WINDOW --- */
        .aero-window {
            position: absolute;
            width: 90%;
            max-width: 620px;
            background: var(--glass-horror);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--blood-red);
            border-radius: 8px;
            box-shadow: 0 0 35px rgba(139, 0, 0, 0.8), inset 0 0 15px rgba(255, 0, 0, 0.3);
            z-index: 10;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: none;
        }

        /* Window Titlebar (Draggable Handle) */
        .window-titlebar {
            background: linear-gradient(180deg, #4a0000 0%, #1a0000 100%);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--blood-red);
            cursor: move !important;
        }

        .window-title-text {
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            color: var(--bright-red);
            text-shadow: 0 0 8px red;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .window-controls {
            display: flex;
            gap: 6px;
        }

        .win-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #000;
        }

        .win-close { background: #ff0000; box-shadow: 0 0 8px red; }
        .win-min { background: #660000; }
        .win-max { background: #330000; }

        .window-content {
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, rgba(40,0,0,0.4) 0%, rgba(5,0,0,0.9) 100%);
        }

        /* --- HEADER & TITLE --- */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .metal-title {
            font-family: 'Creepster', cursive;
            font-size: 4.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--bright-red);
            text-shadow: 0 0 20px red, 3px 3px 0px #000;
            animation: bloodPulse 2s infinite alternate;
        }

        @keyframes bloodPulse {
            0% { filter: drop-shadow(0 0 5px red); }
            100% { filter: drop-shadow(0 0 20px var(--bright-red)); }
        }

        .subtitle {
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: #8a8580;
            margin-top: -5px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* --- BUTTONS --- */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            width: 100%;
        }

        .tool-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 14px 40px;
            font-family: 'Metal Mania', cursive;
            font-size: 2rem;
            text-transform: uppercase;
            color: #fff;
            text-decoration: none;
            cursor: pointer !important;
            border: 2px solid var(--blood-red);
            width: 85%;
            max-width: 340px;
            background: linear-gradient(180deg, #300000 0%, #100000 100%);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(0,0,0,0.8);
            text-shadow: 0 0 8px red;
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background: var(--blood-red);
            color: #000;
            box-shadow: 0 0 30px var(--bright-red);
            transform: scale(1.05) rotate(1deg);
            text-shadow: none;
        }

        .back-btn {
            border-color: #444;
            background: linear-gradient(180deg, #222 0%, #050505 100%);
            color: #888;
            text-shadow: none;
        }

        .back-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 25px #fff;
            transform: scale(1.05) rotate(-1deg);
        }

        /* Status Bar */
        .window-statusbar {
            background: #100000;
            border-top: 1px solid var(--blood-red);
            padding: 6px 12px;
            font-size: 0.85rem;
            color: var(--bright-red);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <div class="horror-flash"></div>

    <!-- CREEPYPASTA BACKGROUND ENTITIES -->
    <!-- BEN DROWNED -->
    <img src="https://www.pngkey.com/png/full/226-2269517_ben-drowned-who-me-awesome-creepypasta.png" alt="BEN DROWNED" class="creepypasta-entity entity-ben">
    
    <!-- JEFF THE KILLER -->
    <img src="https://www.pngitem.com/pngs/m/115-1152412_jeff-the-killer-png-transparent-png.png" alt="Jeff The Killer" class="creepypasta-entity entity-jeff">

    <!-- SLENDERMAN -->
    <img src="https://pngimg.com/uploads/slender_man/slender_man_PNG71793.png" alt="Slenderman" class="creepypasta-entity entity-slender">

    <!-- CORRUPTED AERO WINDOW -->
    <div class="aero-window" id="aeroWindow">
        <!-- Title Bar (Draggable Handle) -->
        <div class="window-titlebar" id="windowTitlebar">
            <div class="window-title-text">
                ⚠️ C:\SYSTEM32\SYSTEM_CORRUPT.EXE
            </div>
            <div class="window-controls">
                <div class="win-btn win-min"></div>
                <div class="win-btn win-max"></div>
                <div class="win-btn win-close"></div>
            </div>
        </div>

        <!-- Inner Content -->
        <div class="window-content">
            <!-- HEADER -->
            <header>
                <h1 class="metal-title">TOOLS</h1>
                <p class="subtitle">(unblock everything)</p>
            </header>

            <!-- MAIN ACTION -->
            <main>
                <div class="button-container">
                    <a href="proxy.html" class="tool-btn" onclick="navigateToPage(event, this.href)">WEB PROXY</a>
                    <a href="movies.html" class="tool-btn" onclick="navigateToPage(event, this.href)">MOVIES</a>
                    <a href="index.html" class="tool-btn back-btn" onclick="navigateToPage(event, this.href)">← HOME</a>
                </div>
            </main>
        </div>

        <!-- Status Bar -->
        <div class="window-statusbar">
            <span>SYSTEM CORRUPTED</span>
            <span>ERROR 666</span>
        </div>
    </div>

    <script>
        // Navigation function
        function navigateToPage(event, destinationUrl) {
            event.preventDefault();
            document.body.classList.add('fade-out');

            setTimeout(() => {
                window.location.href = destinationUrl;
            }, 300);
        }

        // Draggable Window Script
        const windowElem = document.getElementById('aeroWindow');
        const titlebarElem = document.getElementById('windowTitlebar');

        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        function startDrag(e) {
            if (e.target.classList.contains('win-btn')) return;

            isDragging = true;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            const rect = windowElem.getBoundingClientRect();
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
        }

        function onDrag(e) {
            if (!isDragging) return;

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            let newX = clientX - offsetX;
            let newY = clientY - offsetY;

            const minX = 5;
            const minY = 5;
            const maxX = window.innerWidth - windowElem.offsetWidth - 5;
            const maxY = window.innerHeight - windowElem.offsetHeight - 5;

            newX = Math.max(minX, Math.min(newX, maxX));
            newY = Math.max(minY, Math.min(newY, maxY));

            windowElem.style.left = `${newX}px`;
            windowElem.style.top = `${newY}px`;
            windowElem.style.transform = 'none';
        }

        function stopDrag() {
            isDragging = false;
        }

        titlebarElem.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);

        titlebarElem.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', onDrag);
        window.addEventListener('touchend', stopDrag);
    </script>
</body>
</html>
