<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOLS | DILL DOH</title>
    <!-- Vercel Web Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>
    <!-- Sharp Metal & Grunge Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1b18;
            --paper-brown: #3d342b;
            --paper-light: #d6ce1f;
            --text-white: #f1f1f1;
            --text-grey: #8a8580;
            --dark-grey: #2b2b2b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            font-family: 'Permanent Marker', cursive, sans-serif;
            transition: opacity 0.5s ease;
            position: relative;
        }

        /* --- BACKGROUND CAT IMAGES --- */
        .bg-cat {
            position: absolute;
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }

        .bg-cat-kitten {
            bottom: 0;
            left: 20px;
            width: 250px;
            max-width: 30vw;
            opacity: 0.85;
            filter: drop-shadow(2px 4px 10px rgba(0,0,0,0.7));
        }

        .bg-cat-nyan {
            top: 15%;
            right: 30px;
            width: 280px;
            max-width: 35vw;
            opacity: 0.85;
            filter: drop-shadow(0px 0px 12px rgba(255, 255, 255, 0.2));
            animation: float-cat 4s ease-in-out infinite alternate;
        }

        @keyframes float-cat {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(3deg); }
        }

        /* --- LOADING SCREEN --- */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loader-box {
            padding: 20px 40px;
            background-color: var(--card-bg);
            border: 2px solid var(--text-grey);
            clip-path: polygon(
                0% 5%, 10% 0%, 25% 6%, 40% 1%, 55% 7%, 70% 0%, 85% 6%, 100% 1%,
                98% 50%, 100% 95%, 85% 90%, 70% 100%, 55% 92%, 40% 98%, 25% 91%, 10% 100%, 0% 92%
            );
        }

        .loader-text {
            font-family: 'Metal Mania', cursive;
            font-size: 2rem;
            color: var(--text-white);
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse-grey 1s infinite alternate;
        }

        @keyframes pulse-grey {
            0% { color: var(--text-grey); }
            100% { color: var(--text-white); }
        }

        .loaded #loader-wrapper {
            opacity: 0;
            visibility: hidden;
        }

        body.fade-out {
            opacity: 0;
        }

        /* --- HEADER --- */
        header {
            margin-top: 10vh;
            text-align: center;
            z-index: 2;
        }

        .metal-title {
            font-family: 'Metal Mania', cursive;
            font-size: 5.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--text-white);
            background: linear-gradient(180deg, #ffffff 0%, #a3a3a3 50%, #3a3a3a 51%, #757575 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(4px 4px 0px #000);
        }

        .subtitle {
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--text-grey);
            margin-top: -10px;
            text-transform: uppercase;
        }

        /* --- MAIN CONTAINER & BUTTONS --- */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            z-index: 2;
        }

        .ripped-container {
            position: relative;
            transform: rotate(-2deg);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .tool-btn {
            display: inline-block;
            padding: 18px 60px;
            font-family: 'Permanent Marker', cursive;
            font-size: 2.2rem;
            text-transform: uppercase;
            background-color: var(--paper-brown);
            color: #f1f1f1;
            text-decoration: none;
            cursor: pointer;
            border: none;
            text-align: center;
            min-width: 320px;
            clip-path: polygon(
                0% 10%, 8% 0%, 18% 8%, 28% 1%, 38% 9%, 48% 2%, 58% 10%, 68% 1%, 78% 8%, 88% 0%, 100% 9%,
                97% 35%, 100% 65%, 96% 90%, 
                88% 100%, 78% 92%, 68% 99%, 58% 91%, 48% 98%, 38% 90%, 28% 100%, 18% 93%, 8% 99%, 0% 90%,
                3% 60%, 0% 30%
            );
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .back-btn {
            transform: rotate(2deg);
            background-color: var(--dark-grey);
            font-size: 1.8rem;
        }

        .tool-btn:hover {
            background-color: #52463a;
            color: #ffffff;
            transform: scale(1.08) rotate(2deg);
        }

        .back-btn:hover {
            background-color: #3f3f3f;
            transform: scale(1.08) rotate(-2deg);
        }

        .tool-btn:active {
            transform: scale(0.95);
        }

        .tape {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-1deg);
            width: 100px;
            height: 28px;
            background-color: rgba(255, 255, 255, 0.15);
            border-left: 1px dashed rgba(255,255,255,0.3);
            border-right: 1px dashed rgba(255,255,255,0.3);
            pointer-events: none;
            z-index: 3;
        }

        footer {
            margin-bottom: 25px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- BACKGROUND CAT IMAGES -->
    <img src="https://png.pngtree.com/png-vector/20240917/ourmid/pngtree-funny-kitten-cat-standing-or-dancing-isolated-png-image_13844217.png" alt="Dancing Kitten" class="bg-cat bg-cat-kitten">
    <img src="https://wallpapers.com/images/featured/nyan-cat-png-az8jeatasi3z7yda.png" alt="Nyan Cat" class="bg-cat bg-cat-nyan">

    <!-- LOADING SCREEN -->
    <div id="loader-wrapper">
        <div class="loader-box">
            <div class="loader-text">TOOLS</div>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <h1 class="metal-title">TOOLS</h1>
        <p class="subtitle">(unblock everything)</p>
    </header>

    <!-- MAIN ACTION -->
    <main>
        <div class="ripped-container">
            <div class="tape"></div>
            <a href="proxy.html" class="tool-btn" onclick="navigateToPage(event, this.href)">web proxy</a>
            <a href="index.html" class="tool-btn back-btn" onclick="navigateToPage(event, this.href)">← home</a>
        </div>
    </main>

    <footer></footer>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 800);
        });

        function navigateToPage(event, destinationUrl) {
            event.preventDefault();
            document.body.classList.add('fade-out');

            setTimeout(() => {
                window.location.href = destinationUrl;
            }, 400);
        }
    </script>
</body>
</html>
