<!doctype html>
<!-- SMM2 Recomp web build: GPL-3.0 (LICENSE.txt); built on LAS Recomp (MIT) - THIRD-PARTY.txt -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mario Maker 2</title>
<style>
  :root { --bg: #0e0e10; --panel: #1b1b1f; --line: #2e2e34; --text: #ececf0; --dim: #9a9aa6; --accent: #00c8e1; --bad: #ff6b6b; --ok: #4fd18b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* start screen: black, one bar that fills while the files load, then the play button in its place */
  #setup { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  #loadwrap { width: min(420px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #bar { width: 100%; height: 6px; border-radius: 3px; background: #1c1c1f; overflow: hidden; }
  #barfill { width: 0; height: 100%; background: #fff; border-radius: 3px; transition: width .15s linear; }
  #bar.busy #barfill { width: 30%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  #importmsg, #status { color: #8a8a92; font-size: 13px; text-align: center; white-space: pre-wrap; min-height: 1.45em; }
  /* what is downloading right now, how fast, how much longer */
  #dl { display: none; width: 100%; color: #6f6f79; font: 12px/1.5 ui-monospace, Consolas, monospace; text-align: center; }
  #dlwhat { color: #a9a9b4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dlstat { color: #6a6a74; }
  #start { display: none; background: #fff; color: #000; border: 0; border-radius: 999px; padding: 14px 54px; font: 700 18px system-ui, sans-serif; letter-spacing: .04em; cursor: pointer;
    animation: fadein .4s ease-out; }
  #start:hover { background: #e6e6e6; } #start:focus { outline: none; } #start:disabled { opacity: .4; cursor: default; }
  @keyframes fadein { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  #pick { display: none; background: transparent; color: #fff; border: 1px solid #444; border-radius: 999px; padding: 9px 22px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  #credit { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #4a4a50; font-size: 11px; padding: 0 16px; }
  #credit a { color: #5a5a62; }
  #hidden { display: none; }
  button { font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; }
  #game { position: fixed; inset: 0; background: #000; display: none; align-items: center; justify-content: center; }
  #screen { position: absolute; width: 100%; height: 100%; object-fit: fill; image-rendering: auto; outline: none; touch-action: none; }
  #fpsbox { position: fixed; left: 8px; top: 8px; display: none; background: rgba(0,0,0,.55); color: #fff; font: 600 13px ui-monospace, Consolas, monospace; padding: 3px 7px; border-radius: 5px; }
  /* on-screen controls */
  #touch { position: fixed; inset: 0; display: none; z-index: 4; touch-action: none; user-select: none; -webkit-user-select: none; pointer-events: none; }
  #t-base { position: absolute; display: none; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: none; }
  #t-knob { position: absolute; left: 34px; top: 34px; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.55); }
  #t-stick { position: absolute; left: 0; bottom: 0; width: 40%; height: 55%; pointer-events: auto; }
  .tbtn { position: absolute; width: 58px; height: 58px; border-radius: 50%; background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.5); color: #fff;
    font: 700 21px/54px system-ui, sans-serif; text-align: center; touch-action: none; pointer-events: auto; }
  .tbtn.sm { width: 50px; height: 34px; border-radius: 10px; font-size: 15px; line-height: 30px; }
  .tbtn.down { background: rgba(255,255,255,.45); color: #000; }
  #hud { position: fixed; top: 8px; right: 8px; display: none; gap: 6px; opacity: .25; transition: opacity .2s; z-index: 5; }
  #hud:hover { opacity: 1; }
  #log { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 34%; background: rgba(10,10,12,.92); color: #cfd; font: 12px/1.35 ui-monospace, Consolas, monospace;
         overflow: auto; padding: 8px 10px; white-space: pre-wrap; border-top: 1px solid var(--line); z-index: 6; }
  #shaderbox { position: fixed; right: 8px; bottom: 8px; display: none; background: rgba(0,0,0,.55); color: #fff; font: 600 12px system-ui, sans-serif; padding: 3px 8px; border-radius: 5px; z-index: 3; pointer-events: none; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div id="setup">
  <div id="loadwrap">
    <div id="bar" class="busy"><div id="barfill"></div></div>
    <button id="start" disabled>PLAY</button>
    <div id="importmsg"></div>
    <div id="status"></div>
    <div id="dl"><div id="dlwhat"></div><div id="dlstat"></div></div>
    <button id="pick">Import game files from a folder…</button>
  </div>
  <div id="credit">SMM2 Recomp (<a href="LICENSE.txt">GPL-3.0</a>), built on LAS Recomp (<a href="LICENSE-LASRecomp.txt">MIT</a>) — <a href="THIRD-PARTY.txt">third-party notices</a>. Not affiliated with Nintendo.</div>
  <!-- kept for the script: browser checks, data state, maintenance buttons -->
  <div id="hidden"><h1 id="title"></h1><ul id="checks"></ul><div id="datastate"></div><button id="wipe"></button><button id="getlog"></button>
    <progress id="prog" value="0" max="1"></progress></div>
</div>

<div id="game"><canvas id="screen" tabindex="0" width="1280" height="720"></canvas></div>
<div id="fpsbox"></div>
<div id="shaderbox"></div>
<div id="touch"><div id="t-stick"></div><div id="t-base"><div id="t-knob"></div></div></div>
<div id="hud"><button class="ghost" id="fs">Fullscreen</button><button class="ghost" id="showfps">FPS</button><button class="ghost" id="showlog">Log</button></div>
<div id="log"></div>
<script>
// The game data (3.1 GB) lives in a public parts repo because this host caps files at 25 MiB.
// Everything the page does not ship itself is data and is fetched from the parts repo: single parts,
// whole files stitched from their parts, and the file list. Parts are pipelined a few at a time.
// The same hook reports what is downloading, how fast and how long is left.
(function () {
  var REMOTE = 'https://raw.githubusercontent.com/SipOnDaBajaBlast/smm2-data/main/';
  var PRE = '/ports/smm2/';
  var LOCAL = ['', 'shell.js', 'mmk.js', 'mmk.wasm', 'coi-sw.js', 'audio_worklet.js', 'course_worker.js',
               'Super Mario Maker 2.js', 'LICENSE.txt', 'LICENSE-LASRecomp.txt', 'THIRD-PARTY.txt'];
  var DATA = /^(gamedata\/|split\.json$|game\.json$|shaders\.json\.gz$)/;
  var AHEAD = 2;                                   // extra parts fetched alongside the one being read
  var CACHE = 'smm2-module-v1';                    // the module's parts, kept so a return visit is quick
  var orig = window.fetch.bind(window);
  var split = null, total = 0, done = 0, label = '', lastText = '', lastPaint = 0;
  var samples = [], ahead = new Map();             // part url -> its bytes, dropped as soon as they are read
  var cacheReady = ('caches' in window) ? caches.open(CACHE).catch(function () { return null; }) : Promise.resolve(null);

  // the page is already cross-origin isolated by its response headers, so the build's worker shim for that
  // (and the reload it forces) is not needed. it also used to stitch the module from local part urls,
  // which this host cannot serve, so it is switched off and any earlier copy is removed.
  if ('serviceWorker' in navigator) {
    try { navigator.serviceWorker.register = function () { return Promise.reject(new Error('cross-origin isolation already provided by the response headers')); }; } catch (e) {}
    try { navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {}); } catch (e) {}
  }

  function byId(id) { return document.getElementById(id); }
  function size(b) {
    if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    return Math.round(b / 1024) + ' KB';
  }
  function left(s) {
    if (!isFinite(s) || s <= 0) return '';
    if (s < 60) return 'under a minute left';
    var m = Math.round(s / 60);
    if (m < 60) return 'about ' + m + ' min left';
    return 'about ' + Math.floor(m / 60) + ' h ' + (m % 60) + ' min left';
  }
  function speed() {                               // bytes per second over the last few seconds
    if (samples.length < 2) return 0;
    var a = samples[0], b = samples[samples.length - 1], dt = (b.t - a.t) / 1000;
    return dt > 0.4 ? (b.n - a.n) / dt : 0;
  }
  function paint() {
    var box = byId('dl'); if (!box) return;
    if (total && done >= total) label = 'game data downloaded';
    var stat = [];
    if (total) stat.push(size(done) + ' of ' + size(total) + ' · ' + Math.floor(done / total * 100) + '%');
    var r = speed();
    if (r > 1024) { stat.push((r / 1048576).toFixed(1) + ' MB/s'); if (total > done) stat.push(left((total - done) / r)); }
    var text = label + '\u0000' + stat.join(' · ');
    if (text === lastText) return;
    lastText = text;
    byId('dlwhat').textContent = label;
    byId('dlstat').textContent = stat.join(' · ');
    box.style.display = 'block';
  }
  function sample() {
    var now = Date.now();
    samples.push({ t: now, n: done });
    while (samples.length > 2 && now - samples[0].t > 8000) samples.shift();
    if (now - lastPaint > 200) { lastPaint = now; paint(); }
  }
  function remoteUrl(rel) { return new URL(REMOTE + rel).href; }

  // split.json says which files come in parts and how big each one is: that is the overall total
  orig(remoteUrl('split.json'), { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (m) {
    if (!m) return;
    split = m; total = 0;
    for (var key in m) total += m[key].size || 0;
    paint();
  }).catch(function () {});

  function partOf(rel) {                           // name.000 -> { base: name, idx: 0, count: 57 }
    var m = /^(.*)\.(\d{3})$/.exec(rel);
    if (!m || !split || !split[m[1]]) return null;
    return { base: m[1], idx: +m[2], count: split[m[1]].parts, size: split[m[1]].size };
  }
  function isModule(rel) { return /\.wasm$/.test(rel) && split && split[rel]; }
  function cachedPart(rel) {
    if (!isModule(rel.slice(0, -4)) || !cacheReady) return Promise.resolve(null);
    return cacheReady.then(function (c) { return c ? c.match(remoteUrl(rel)) : null; })
      .then(function (r) { return r ? r.arrayBuffer() : null; }).catch(function () { return null; });
  }
  function rememberPart(rel, buf) {
    if (!cacheReady || !/\.wasm\.\d{3}$/.test(rel)) return;
    cacheReady.then(function (c) { return c ? c.put(remoteUrl(rel), new Response(buf)) : null; }).catch(function () {});
  }
  function fetchPart(rel) {
    if (!ahead.has(rel)) ahead.set(rel, cachedPart(rel).then(function (hit) {
      if (hit) return hit;
      return orig(remoteUrl(rel), { cache: 'no-cache' }).then(function (r) {
        if (!r.ok) throw new Error(rel + ': HTTP ' + r.status);
        return r.arrayBuffer().then(function (buf) { rememberPart(rel, buf); return buf; });
      });
    }));
    return ahead.get(rel);
  }
  function aheadFrom(info) {
    for (var k = 1; k <= AHEAD; k++) {
      var j = info.idx + k;
      if (j < info.count) fetchPart(info.base + '.' + String(j).padStart(3, '0'));
    }
  }

  // wraps a response body so the bytes are counted as the loader reads them
  function counted(res, name, count) {
    if (!res || !res.body) return res;
    var rd = res.body.getReader();
    var stream = new ReadableStream({
      pull: function (ctrl) {
        return rd.read().then(function (x) {
          if (x.done) { ctrl.close(); return; }
          if (count) { done += x.value.byteLength; sample(); }
          ctrl.enqueue(x.value);
        });
      },
      cancel: function (why) { try { rd.cancel(why); } catch (e) {} }
    });
    return new Response(stream, { status: res.status, statusText: res.statusText, headers: res.headers });
  }

  function dataFetch(rel, info, init) {
    var name = label, part = !!info;
    var ready = info ? ahead.get(rel) : null;
    if (ready) ahead.delete(rel);
    var res = ready
      ? ready.then(function (buf) { return new Response(buf, { headers: { 'Content-Length': String(buf.byteLength) } }); })
      : orig(remoteUrl(rel), init || {}).then(function (r) {
          if (!r.ok) throw new Error(rel + ': HTTP ' + r.status);
          return r;
        });
    return res.then(function (r) { return counted(r, name, part); });
  }

  // one whole file that only exists as parts: handed back as a single stream, in order
  function joined(base, e) {
    var idx = 0, cur = null, off = 0;
    var body = new ReadableStream({
      pull: function (ctrl) {
        if (cur) {
          if (off < cur.byteLength) {
            var chunk = cur.subarray(off, Math.min(off + 262144, cur.byteLength));
            off += chunk.byteLength; ctrl.enqueue(chunk); return;
          }
          cur = null; off = 0;
        }
        if (idx >= e.parts) { ctrl.close(); return; }
        var name = base + '.' + String(idx).padStart(3, '0');
        idx++;
        return fetchPart(name).then(function (buf) {
          cur = new Uint8Array(buf); off = 0;
          if (idx < e.parts) aheadFrom({ base: base, idx: idx, count: e.parts });
        });
      }
    });
    return new Response(body, { headers: { 'Content-Length': String(e.size) } });
  }

  window.fetch = function (input, init) {
    try {
      var u = (input instanceof Request) ? input.url : String(input);
      var abs = new URL(u, location.href);
      if (abs.origin === location.origin) {
        var p = abs.pathname.indexOf(PRE) === 0 ? abs.pathname.slice(PRE.length) : null;
        if (p !== null) {
          var rel = decodeURI(p), info = partOf(rel);
          if (info) {                              // one part of a file that comes in parts
            label = info.base + ' — part ' + (info.idx + 1) + ' of ' + info.count;
            if (!total) { total = 0; for (var key in split) total += split[key].size || 0; }
            aheadFrom(info);
            paint();
            return dataFetch(rel, info, init);
          }
          if (isModule(rel)) {                     // the whole module, stitched from its parts
            label = rel;
            paint();
            return Promise.resolve(counted(joined(rel, split[rel]), rel, true));
          }
          if (DATA.test(rel)) {                    // small lists and the shader pack
            label = rel === 'split.json' ? '' : rel;
            paint();
            return dataFetch(rel, null, init);
          }
        }
      }
    } catch (e) {}
    return orig(input, init);
  };
})();
</script>
<script src="shell.js"></script>
</body>
</html>
