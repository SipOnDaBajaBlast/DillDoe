<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>try{sessionStorage["setItem"]("granuleChannel","demo");sessionStorage["setItem"]("granuleVersion","0.2.14");}catch(a){}</script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Granule</title>
    
    <link rel="icon" type="image/png" href="./granule_icon.png" />
    <style>:root {
        --gf: "Granule", ui-monospace, monospace;
        --gfs: "Granule Small", ui-monospace, monospace;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
        
      }
      #app {
        width: 100vw;
        height: 100vh;
        height: 100dvh; 
        display: flex;
        flex-direction: row;
        align-items: stretch;
        
        box-sizing: border-box;
        padding: 0;
        gap: 0;
      }
      
      #app > .col-side {
        flex: 0 0 auto;
        max-height: 100vh;
        max-height: 100dvh;
        
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        align-items: stretch;
      }
      #app > .col-side.col-right { justify-content: flex-end; }
      
      #granule-chrome {
        display: none; height: 28px; align-items: stretch; box-sizing: border-box;
        background: #0a0a0a; color: #8f8f8f; border-bottom: 1px solid #1c1c1c;
        
        font: 20px/27px var(--gfs); letter-spacing: 0; user-select: none;
        -webkit-app-region: drag; position: relative; z-index: 200;
      }
      
      #granule-chrome .gc-drag { flex: 1 1 auto; padding-left: 12px; padding-top: 2px; box-sizing: border-box; }
      #granule-chrome .gc-btn {
        -webkit-app-region: no-drag; width: 46px; height: 100%; border: 0; padding: 0; margin: 0;
        background: transparent; color: #8f8f8f; font: 20px/27px var(--gf); cursor: inherit;
        position: relative; padding-top: 2px; box-sizing: border-box;
      }
      
      #granule-chrome #gc-min::before,
      #granule-chrome #gc-max::before,
      #granule-chrome #gc-max.gc-restored::after {
        content: ""; position: absolute; box-sizing: border-box;
      }
      #granule-chrome #gc-min::before { left: 18px; top: 13px; width: 10px; height: 2px; background: currentColor; }
      #granule-chrome #gc-max::before { left: 18px; top: 9px; width: 10px; height: 10px; border: 2px solid currentColor; }
      
      #granule-chrome #gc-max.gc-restored::before { left: 17px; top: 11px; width: 9px; height: 9px; }
      #granule-chrome #gc-max.gc-restored::after {
        left: 20px; top: 8px; width: 9px; height: 9px;
        border-top: 2px solid currentColor; border-right: 2px solid currentColor;
      }
      #granule-chrome .gc-btn:hover { background: #1e1e1e; color: #e6e6e6; }
      #granule-chrome .gc-btn.gc-close:hover { background: #8b1e1e; color: #fff; }
      body.desktop-shell #granule-chrome { display: flex; }
      body.desktop-shell #app { height: calc(100vh - 28px); height: calc(100dvh - 28px); }
      body.desktop-shell.shell-fullscreen #granule-chrome { display: none; }
      body.desktop-shell.shell-fullscreen #app { height: 100vh; height: 100dvh; }
      
      body.desktop-shell:not(.shell-fullscreen) #granule-channel-badge { top: 34px !important; }
      
      body.desktop-shell:not(.shell-fullscreen) #granule-title .gt-statusrow,
      body.desktop-shell:not(.shell-fullscreen) #granule-title .gt-lang { top: 42px !important; }
      
      #app > .col-center {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      
      #app > .col-center > .canvas-host {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      
      .canvas-host canvas { touch-action: none; }
      html, body { overscroll-behavior: none; }

      body.touch-mode #app > .col-side.col-left { display: none; }
      body.touch-mode.dock-open #app > .col-side.col-left { display: flex; -webkit-overflow-scrolling: touch; }
      body.touch-mode #app > .col-side.col-right { display: none; }
      
      body.touch-mode #app { padding-right: 124px; box-sizing: border-box; }
      
      body.touch-mode #granule-channel-badge { right: 132px !important; }
      
      body.touch-mode .granule-dock canvas { touch-action: pan-y; }
      body.touch-mode .granule-dock > div { -webkit-overflow-scrolling: touch; }

      #granule-title {
        position: fixed;
        inset: 0;
        z-index: 110;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 56px;
        user-select: none;
        
        font-family: var(--gf);
        transition: opacity 0.5s ease;
      }
      
      #gt-dust  { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
      #gt-grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
      #granule-title .gt-word,
      #granule-title .gt-menu,
      #granule-title .gt-statusrow,
      #granule-title .gt-corner { position: relative; z-index: 2; }
      
      #granule-title .gt-word,
      #granule-title .gt-menu {
        position: absolute; left: 0; right: 0;
        transform: translateY(-50%);
      }
      #granule-title .gt-word { top: 25%; }
      #granule-title .gt-menu { top: 60%; }
      
      #granule-title .gt-word {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: clamp(2px, 0.6vw, 10px);
        min-height: clamp(70px, 11vw, 150px);
      }
      #granule-title .gt-word img {
        display: block;
        height: clamp(70px, 11vw, 150px);
        width: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        user-select: none;
      }
      
      #granule-title .gt-word img {
        filter: brightness(0.66) contrast(1.06);
        -webkit-mask-image: repeating-conic-gradient(rgba(0,0,0,1) 0% 25%, rgba(0,0,0,0.72) 0% 50%);
        mask-image: repeating-conic-gradient(rgba(0,0,0,1) 0% 25%, rgba(0,0,0,0.72) 0% 50%);
        -webkit-mask-size: 6px 6px;
        mask-size: 6px 6px;
      }
      #granule-title .gt-item img {
        filter: brightness(0.6) contrast(1.06);
        -webkit-mask-image: repeating-conic-gradient(rgba(0,0,0,1) 0% 25%, rgba(0,0,0,0.76) 0% 50%);
        mask-image: repeating-conic-gradient(rgba(0,0,0,1) 0% 25%, rgba(0,0,0,0.76) 0% 50%);
        -webkit-mask-size: 4px 4px;
        mask-size: 4px 4px;
      }
      
      #granule-title .gt-menu { display: flex; flex-direction: column; align-items: center; gap: 46px; }
      #granule-title .gt-item {
        position: relative;
        color: #8b929c;
        font-size: 15px;
        letter-spacing: 4px;
        padding: 4px 26px;
        cursor: inherit;
      }
      
      #granule-title .gt-item.gt-lettered { display: flex; align-items: center; gap: 5px; }
      #granule-title .gt-item img {
        display: block;
        height: 36px;
        width: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        user-select: none;
      }
      #granule-title .gt-item.sel { color: #d6dce6; }
      #granule-title .gt-item.sel::before { content: "\25B8"; position: absolute; left: 4px; }
      
      #granule-title .gt-item.sel img { filter: brightness(0.95); }
      #granule-title.ready #gt-enter { color: #c9d0da; }
      #granule-title.ready #gt-enter img { filter: brightness(0.82); }
      @keyframes gt-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
      #granule-title .gt-item.gt-nope { animation: gt-shake 0.16s 2; color: #6f665c; }
      
      #granule-title .gt-item.gt-off { color: #4a453f; cursor: inherit; }
      #granule-title .gt-item.gt-off.sel { color: #6f665c; }
      #granule-title .gt-item.gt-off img { filter: brightness(0.32); opacity: 0.7; }
      #granule-title .gt-item.gt-off.sel img { filter: brightness(0.5); opacity: 0.8; }
      
      #granule-title .gt-note {
        position: absolute; top: calc(100% + 34px); left: 50%;
        transform: translateX(-50%);
        width: max-content;
        font-size: 20px; color: #55504a;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      #granule-title .gt-note.gt-note-wait { visibility: hidden; }
      
      #granule-title:has(.gt-road:hover) .gt-note,
      #granule-title:has(.gt-road.open) .gt-note { opacity: 0; }

      
      #granule-title .gt-statusrow {
        position: absolute; top: 14px; left: 20px;
        display: flex; justify-content: flex-start; gap: 18px;
        font-size: 17px; color: #6f665c; min-height: 1em; opacity: 0.72;
      }
      #gt-timer { color: #4a453f; }
      
      #granule-title .gt-corner { position: absolute; bottom: 16px; font-size: 30px; color: #4a453f; }
      
      #granule-title .gt-credit-wrap { left: 20px; }
      #granule-title .gt-ver-corner { right: 20px; }

      #granule-title .gt-shelf-corner {
        left: 50%; transform: translateX(-50%);
        width: max-content; max-width: 92vw;
        display: flex; justify-content: center;
      }
      
      #granule-title .gt-shelf {
        position: relative;

        padding: 6px 16px;
        background-size: 8px 8px;
        image-rendering: pixelated;

        box-shadow: inset 0 0 0 2px #262522, 0 0 0 2px #0b0a09;
        transition: box-shadow 0.25s ease;
      }
      #granule-title .gt-shelf:hover { box-shadow: inset 0 0 0 2px #3e3c39, 0 0 0 2px #0b0a09; }
      
      #granule-title .gt-shelf::before,
      #granule-title .gt-shelf::after {
        content: ""; position: absolute; z-index: -1; pointer-events: none;
        background-size: 8px 8px; image-rendering: pixelated;
      }
      #granule-title .gt-shelf::before { inset: -4px; }
      #granule-title .gt-shelf::after  { inset: -11px; }
      
      #granule-title .gt-shelf-row {
        
        display: flex; align-items: center; justify-content: center; gap: 9px;
        
        padding: 4px 0;
        color: #7d7468;
        text-decoration: none;
        pointer-events: auto;
        cursor: inherit;
        white-space: nowrap;
        background-size: 8px 8px;
        image-rendering: pixelated;
      }

      #granule-title .gt-shelf-row::before {
        content: "\25B8";
        font-size: 0.86em; line-height: 1;
        opacity: 0; transition: opacity 0.16s ease;
      }
      #granule-title .gt-shelf-row:hover::before { opacity: 1; }
      
      #granule-title .gt-shelf-row::after {
        content: "\25B8";
        font-size: 0.86em; line-height: 1;
        visibility: hidden;
      }
      
      #granule-title .gt-shelf-row canvas { vertical-align: middle; transition: filter 0.22s ease; }
      #granule-title .gt-shelf-row:hover canvas { filter: brightness(1.28); }
      #granule-title .gt-shelf-row:hover { color: #c3b6a5; }   
      
      #granule-title .gt-shelf-fig {
        position: absolute; z-index: -1; pointer-events: none; image-rendering: pixelated;
      }

      #granule-title .gt-road-corner {
        left: 20px; top: 30%; bottom: auto;
        width: max-content;
      }
      #granule-title .gt-road {
        position: relative;
        
        width: max-content;
        padding: 10px 16px 10px 13px;
        font-size: 30px; color: #7d7468;
        pointer-events: auto; cursor: inherit;
        background-size: 8px 8px; image-rendering: pixelated;
        
        box-shadow: inset 0 0 0 2px #262522, 0 0 0 2px #0b0a09;
        transition: box-shadow 0.25s ease;
      }
      #granule-title .gt-road-corner.gt-road-wait { visibility: hidden; }
      #granule-title .gt-road:hover,
      #granule-title .gt-road.open { box-shadow: inset 0 0 0 2px #3e3c39, 0 0 0 2px #0b0a09; }
      
      #granule-title .gt-road::before,
      #granule-title .gt-road::after {
        content: ""; position: absolute; z-index: -1; pointer-events: none;
        background-size: 8px 8px; image-rendering: pixelated;
      }
      #granule-title .gt-road::before { inset: -4px; }
      #granule-title .gt-road::after  { inset: -11px; }
      
      #granule-title .gt-road-head { display: flex; align-items: center; gap: 9px; white-space: nowrap; padding-bottom: 8px; }
      #granule-title .gt-road-head::before {
        content: "\25B8"; font-size: 0.86em; line-height: 1;
        opacity: 0.7; transition: opacity 0.16s ease, transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #granule-title .gt-road:hover .gt-road-head::before,
      #granule-title .gt-road.open .gt-road-head::before { opacity: 1; transform: rotate(90deg); }
      
      #granule-title .gt-road-body {
        position: relative; overflow: hidden;
        max-height: var(--road-peek, 74px);
        transition: max-height 0.30s cubic-bezier(0.4, 0, 0.2, 1) 0.14s;
      }
      #granule-title .gt-road:hover .gt-road-body,
      #granule-title .gt-road.open .gt-road-body {
        max-height: var(--road-full, 640px);
        transition-delay: 0s;
      }
      
      #granule-title .gt-road-veil {
        position: absolute; left: 0; right: 0; bottom: 0; height: 32px;
        display: flex; flex-direction: column;
        pointer-events: none; transition: opacity 0.22s ease;
      }
      #granule-title .gt-road-veil div { flex: 1; background-size: 8px 8px; image-rendering: pixelated; }
      #granule-title .gt-road:hover .gt-road-veil,
      #granule-title .gt-road.open .gt-road-veil { opacity: 0; }
      
      #granule-title .gt-road-item { padding: 3px 0; }
      
      #granule-title .gt-road-item.done { position: relative; width: fit-content; }
      #granule-title .gt-road-item.done::after {
        content: ""; position: absolute; left: calc(var(--lead, 0px) - 2px); right: -2px; top: 50%;
        height: var(--pf, 2px); transform: translateY(-50%);
        background: currentColor; transition: filter 0.22s ease;
      }
      #granule-title .gt-road:hover .gt-road-item.done::after,
      #granule-title .gt-road.open .gt-road-item.done::after { filter: brightness(1.28); }
      
      #granule-title .gt-road-foot {
        margin-top: 8px; padding-top: 7px;
        border-top: 2px solid #1f1e1b;
        color: #4a453f;
      }
      
      #granule-title .gt-road canvas { display: block !important; transition: filter 0.22s ease; }
      #granule-title .gt-road:hover canvas,
      #granule-title .gt-road.open canvas { filter: brightness(1.28); }
      
      @media (max-width: 820px), (max-height: 640px) {
        #granule-title .gt-road-corner { display: none; }
      }
      
      @media (max-height: 620px) {
        #granule-title .gt-note { display: none; }
      }

      
      #granule-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        transition: opacity 0.55s ease;
        pointer-events: none;
        user-select: none;
      }
      
      #granule-loader .gl-word {
        width: min(66vw, 560px);
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      
      #granule-loader .gl-bar {
        width: min(260px, 58vw);
        height: 12px;
        box-sizing: border-box;
        border: 1px solid #35302a;
        background: #131110;
        padding: 2px;
      }
      #granule-loader .gl-fill {
        height: 100%;
        width: 0%;
        background: #8b929c; 
        transition: none;
      }
      
      #granule-loader .gl-status {
        font-family: var(--gf); font-size: 20px; line-height: 22px; letter-spacing: 0;
        text-transform: uppercase; white-space: nowrap;
        color: #6f665c;
        min-height: 1em;
      }
      
      #granule-loader .gl-timer {
        font-family: var(--gf); font-size: 20px; line-height: 22px; letter-spacing: 0;
        white-space: nowrap;
        color: #4a453f;
        min-height: 1em;
      }</style>
  </head>
  <body>
    
    <div id="granule-title">
      <canvas id="gt-dust"></canvas>
      <canvas id="gt-grain"></canvas>
      <div class="gt-word" id="gt-word"></div>
      <div class="gt-menu">
        <div class="gt-item" id="gt-enter" data-act="enter">ENTER</div>
        <div class="gt-item" id="gt-settings" data-act="settings">SETTINGS</div>
        
        <div class="gt-item gt-off" id="gt-exit" data-act="exit" title="desktop build only">EXIT</div>
        
        <div class="gt-note gt-note-wait" id="gt-note">EARLY BUILD - EXPECT BUGS</div>
      </div>
      <div class="gt-statusrow"><span id="gt-status">loading…</span><span id="gt-timer">0:00</span></div>
      <div class="gt-corner gt-credit-wrap">
        <div class="gt-credit">a game by Tevark</div>
      </div>
      
      <div class="gt-corner gt-shelf-corner" id="gt-shelf-corner"></div>
      
      <div class="gt-corner gt-ver-corner"><div class="gt-ver" id="gt-ver"></div></div>
      
      <div class="gt-corner gt-road-corner gt-road-wait" id="gt-road-corner">
        <div class="gt-road" id="gt-road"></div>
      </div>
    </div>

    <div id="granule-loader" style="display: none">
      <img class="gl-word" src="./granule-wordmark.png" alt="GRANULE" />
      <div class="gl-bar"><div class="gl-fill" id="gl-fill"></div></div>
      <div class="gl-status" id="gl-status">loading…</div>
      <div class="gl-timer" id="gl-timer"></div>
    </div>
